<!DOCTYPE html>
<html lang="ko">
<head>

<title>편입 보카</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Malgun Gothic',-apple-system,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 40px;overflow-x:hidden}
h1{color:#e94560;font-size:1.5em;margin-bottom:3px}
.sub{color:#778;font-size:.85em;margin-bottom:16px}
.panel{background:#16213e;border-radius:14px;padding:17px;width:100%;max-width:600px;margin-bottom:12px}
label{display:block;font-size:.88em;color:#4ecca3;margin-bottom:7px;font-weight:bold;letter-spacing:.02em}
.fld{margin-bottom:15px}
.row{display:flex;gap:8px;align-items:center}
select,button{font-family:inherit;font-size:1.02em;cursor:pointer;border:none;border-radius:8px}
select{background:#0f3460;color:#eee;border:1px solid #2a4a7a;padding:12px 14px;flex:1;min-width:0}
button{background:#e94560;color:#fff;font-weight:bold;padding:12px 16px}

.b2{background:#0f3460;border:1px solid #2a4a7a}
.seg{display:flex;background:#0f3460;border-radius:8px;overflow:hidden;border:1px solid #2a4a7a}
.seg button{flex:1;background:transparent;color:#889;border-radius:0;padding:12px 4px;font-size:.98em}
.seg button.on{background:#e94560;color:#fff}
.mode{display:flex;flex-direction:column;gap:8px}
.mode button{background:#0f3460;border:2px solid #0f3460;border-radius:10px;padding:15px 16px;text-align:left;color:#eee;font-weight:normal}
.mode button.on{border-color:#e94560;background:#1a2a52}
.mode .t{font-weight:bold;font-size:1.08em;display:block;margin-bottom:2px}
.mode .d{font-size:.84em;color:#889;display:block}
.mode button.on .d{color:#aab}
.stat{font-size:.85em;color:#778;margin-top:8px;line-height:1.5}
.stat b{color:#4ecca3}
#msg{padding:14px;border-radius:10px;font-size:.95em;line-height:1.6;display:none;margin-bottom:12px;width:100%;max-width:600px;white-space:pre-line}
#msg.err{background:#3d1a1a;border:1px solid #e94560;color:#fb9;display:block}
#msg.load{background:#16213e;border:1px solid #2a4a7a;color:#8ab;display:block}
.scr{display:none;width:100%;max-width:600px}
.scr.on{display:block}
#bar{background:#16213e;border-radius:9px;padding:10px 14px;margin-bottom:10px;font-size:.95em;color:#4ecca3;text-align:center}
#prog{height:4px;background:#0f3460;border-radius:9px;overflow:hidden;margin-bottom:12px}
#prog i{display:block;height:100%;background:#e94560;width:0;transition:width .25s}
.box{background:#16213e;border-radius:14px;padding:20px;margin-bottom:11px;overflow-wrap:break-word}
.tag{color:#778;font-size:.84em;margin-bottom:5px}
.wd{font-size:1.95em;font-weight:bold;color:#fff;margin-bottom:4px;word-break:break-word;overflow-wrap:break-word;line-height:1.3}
.ask{overflow-wrap:anywhere;word-break:break-word;color:#8ab;font-size:.92em;margin-bottom:15px}
.ch{display:flex;flex-direction:column;gap:8px}
.c{background:#0f3460;border:2px solid #0f3460;border-radius:10px;padding:14px 15px;font-size:1.05em;line-height:1.5;text-align:left;color:#eee;transition:border-color .1s;width:100%;font-weight:normal;word-break:break-word;overflow-wrap:break-word;white-space:normal;min-width:0}
.c:hover:not(:disabled){border-color:#e94560}
.c.ok{background:#1a4731!important;border-color:#4ecca3!important;color:#4ecca3!important}
.c.no{background:#3d1a1a!important;border-color:#e94560!important;color:#e94560!important}
.c.dim{color:#b8c4d4!important;border-color:#2a3a5c!important;opacity:.92!important}
.c.sel{border-color:#f0a500!important;background:#2a2540!important}
.c.miss{border-color:#4ecca3!important;border-style:dashed!important;color:#4ecca3!important}
.fb{margin-top:12px;font-size:.98em;min-height:20px;color:#f0a500;font-weight:bold}
.info{display:none;margin-top:10px;padding:10px 13px;background:#0a2040;border-radius:9px;border-left:3px solid #4ecca3;overflow-wrap:anywhere;overflow-x:hidden;max-width:100%}
.info.on{display:block}
.info{overflow-wrap:break-word;overflow-x:hidden;max-width:100%}
.info .m{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.95em;color:#ddd;margin-bottom:5px;line-height:1.5}
.info .s{font-size:.88em;color:#4ecca3;margin-bottom:4px;line-height:1.7;word-break:break-word;overflow-wrap:anywhere;white-space:normal;max-width:100%}
.info .s::before{content:'동의어 ';font-weight:bold}
.info .r{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.87em;color:#f0a500;line-height:1.45}
.info .r::before{content:'어원 ';font-weight:bold}
.ug{margin:6px 0 3px;overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.84em;color:#7fb3d5;font-weight:bold}
.ug::before{content:'용법 ';color:#5a8caf}
.uf{margin:3px 0;font-size:.82em;color:#9b8fb0;overflow-wrap:anywhere;word-break:break-word;max-width:100%}
.uf::before{content:'분야 ';font-weight:bold;color:#7a6f8a}
.pp{margin:6px 0 4px;overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.86em;color:#f0a500}
.pp::before{content:'전치사 ';font-weight:bold;color:#c89000}
.pp b{color:#ffc857;font-weight:bold}
.pr{padding:6px 0;border-bottom:1px solid #16213e;max-width:100%;overflow-wrap:anywhere}
.pr:last-of-type{border-bottom:none}
.pr.hl{background:#1a3a2e;margin:0 -8px;padding:5px 8px;border-radius:5px;border-bottom:none}
.pd{display:block;font-size:.93em;color:#ddd;line-height:1.45;margin-bottom:3px;word-break:break-word}
.pr.hl .pd{color:#fff;font-weight:bold}
.ps{display:block;font-size:.88em;color:#4ecca3;line-height:1.75;word-break:break-word;overflow-wrap:anywhere;white-space:normal;max-width:100%}
.sy{display:inline;word-break:break-word}
.sy i{font-style:normal;color:#7a8;font-size:.9em;margin-left:2px}
.sy i::before{content:'('}
.sy i::after{content:')'}
.sep{color:#456;margin:0 5px}
.od{font-style:normal;font-size:.95em;color:#c9d4e0;margin-left:7px;font-weight:500;display:inline-block;word-break:break-word}
.od::before{content:'('}
.od::after{content:')'}
.sns{display:block;font-style:normal;font-size:.8em;color:#f0a500;font-weight:bold;margin-bottom:3px;word-break:break-word;line-height:1.35}
.c.ok .sns{color:#f0a500}
.c.ok .od{color:#9fe8c4!important}
.c.no .od{color:#ffb0b0!important;font-weight:600}
.c.miss .od{color:#7d9}
.c.dim .od{color:#9fb0c4!important}
.pr.hl .ps{color:#6f9}
.wi .pr{border-bottom:1px solid #0f3460;padding:5px 0}
.wi .pr:last-of-type{border-bottom:none}
.wi .pd{display:block;font-size:.92em;color:#ddd;line-height:1.45;margin-bottom:3px;overflow-wrap:anywhere;word-break:break-word;max-width:100%}
.wi .pr.hl .pd{color:#fff;font-weight:bold}
.wi .ps{display:block;font-size:.87em;color:#4ecca3;line-height:1.6;word-break:break-word;overflow-wrap:anywhere;white-space:normal;max-width:100%}
.wi .sy i{color:#7a8}
.nav{display:flex;gap:10px;align-items:center;justify-content:center}
.nav button{padding:13px 24px;font-size:1.1em}
.cnt{color:#778;font-size:.95em;min-width:70px;text-align:center}
.card{perspective:1000px;height:280px;margin-bottom:14px;cursor:pointer}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}
.inner.flip{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#16213e;border:2px solid #e94560;overflow-x:hidden;overflow-y:auto;max-width:100%}
.face.b{transform:rotateY(180deg);border-color:#4ecca3;justify-content:flex-start;overflow-y:auto;text-align:left}
.face .num{position:absolute;top:10px;left:14px;font-size:.82em;color:#778}
.face .w{font-size:2.2em;font-weight:bold;color:#fff;word-break:break-word;overflow-wrap:break-word;line-height:1.2;max-width:100%}
.face .hint{font-size:.85em;color:#667;margin-top:8px}
.face.b .m{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:1.02em;color:#eee;line-height:1.5;margin:6px 0 8px}
.face.b .s{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.88em;color:#4ecca3;line-height:1.45;margin-bottom:6px}
.face.b .s::before{content:'동의어 ';font-weight:bold}
.face.b .r{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.86em;color:#f0a500;line-height:1.45}
.face.b .r::before{content:'어원 ';font-weight:bold}
#res{background:#16213e;border-radius:14px;padding:24px;text-align:center}
#rs{font-size:2.6em;font-weight:bold;color:#e94560;margin:5px 0}
#rp{color:#4ecca3;font-weight:bold;margin-bottom:5px}
#rm{color:#778;font-size:.95em;margin-bottom:16px}
.rb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rb button{padding:13px 17px;font-size:1em}
#wrong{background:#16213e;border-radius:14px;padding:18px;margin-top:11px;display:none}
#wrong h3{color:#e94560;font-size:1.1em;margin-bottom:12px}
.wi{border-bottom:1px solid #0f3460;padding:11px 0;max-width:100%;overflow-x:hidden}
.wi:last-child{border-bottom:none}
.wi .n{font-size:.82em;color:#667;margin-bottom:2px}
.wi .w{font-size:1.2em;font-weight:bold;color:#fff;margin-bottom:3px;word-break:break-word}
.wi .x{font-size:.92em;color:#e94560;margin-bottom:2px;word-break:break-word}
.wi .m{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.92em;color:#4ecca3;margin-bottom:2px}
.wi .s{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.87em;color:#4ecca3;line-height:1.4;margin-bottom:2px}
.wi .r{overflow-wrap:anywhere;word-break:break-word;max-width:100%;font-size:.86em;color:#f0a500;line-height:1.4}
.done{background:#16213e;border-radius:12px;padding:20px;text-align:center;color:#4ecca3;font-size:.9em}
#brtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#brcnt{color:#889;font-size:.9em}
.bw{background:#16213e;border-radius:12px;padding:14px 16px;margin-bottom:9px;overflow-wrap:anywhere}
.bw .h{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;gap:10px}
.bw .bword{font-size:1.25em;font-weight:bold;color:#fff;word-break:break-word}
.bw .btag{font-size:.75em;color:#667;white-space:nowrap}
.bw .bgroup{margin-top:9px}
.bw .bd{font-size:.9em;color:#f0a500;font-weight:bold;margin:7px 0 3px;word-break:break-word}
.bw .bs{font-size:.92em;color:#4ecca3;line-height:1.7;word-break:break-word}
.bw .br{margin-top:8px;font-size:.82em;color:#8a7a4a;word-break:break-word;line-height:1.5}
.bw .br::before{content:"어원 ";font-weight:bold}
.bw .none{color:#566;font-size:.85em;margin-top:6px}
.winrow{display:flex;gap:8px;margin-top:12px}
.winrow input{flex:1;background:#0f3460;color:#fff;border:2px solid #2a4a7a;border-radius:10px;padding:14px 15px;font-size:1.1em;font-family:inherit;min-width:0}
.winrow input:focus{outline:none;border-color:#4ecca3}
.winrow button{padding:14px 20px;font-size:1.05em}
#wgot{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;min-height:8px}
#wgot .chip{background:#1a3a2e;color:#6f9;border:1px solid #2a5a44;border-radius:16px;padding:5px 13px;font-size:.9em}
#wgot .chip.miss{background:#3a2a1a;color:#fb8;border-color:#5a4a2a}
.bank.stats .t{color:#f0a500}
.bank.resume{border-color:#4ecca3}
.bank.srs{border-color:#f0a500!important;background:#2a2410!important}
.bank.srs .t{color:#f0a500}
.bank.resume .t{color:#4ecca3}
.bank.resume #resumeGo{background:#4ecca3;color:#0a1128;font-weight:bold}
.stf{background:#0f3460;border:1px solid #2a4a7a;color:#8ab;border-radius:8px;padding:8px 16px;font-size:.9em;margin-right:8px}
.stf.on{background:#e94560;border-color:#e94560;color:#fff;font-weight:bold}
.sw{background:#16213e;border-radius:12px;padding:13px 16px;margin-bottom:8px;overflow-wrap:anywhere;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw .swl{flex:1;min-width:0}
.sw .swe{font-size:1.15em;font-weight:bold;color:#fff;word-break:break-word}
.sw .swm{font-size:.85em;color:#8ab;margin-top:2px;word-break:break-word}
.sw .swc{text-align:right;white-space:nowrap;font-size:.85em}
.sw .swc .wc{color:#e94560;font-weight:bold}
.sw .swc .rc{color:#4ecca3}
.sw.solved{opacity:.55}
#rtsearch{width:100%;background:#0f3460;color:#fff;border:2px solid #2a4a7a;border-radius:10px;padding:12px 14px;font-size:1em;font-family:inherit;margin-bottom:14px}
#rtsearch:focus{outline:none;border-color:#4ecca3}
.rg{background:#16213e;border-radius:12px;padding:14px 16px;margin-bottom:9px;overflow-wrap:anywhere}
.rg .rh{font-size:1.15em;font-weight:bold;color:#4ecca3;margin-bottom:3px}
.rg .rh b{color:#f0a500}
.ex .exko{color:#8ab;font-size:.9em}
.ex{margin-top:9px;padding:9px 12px;background:#12242a;border-left:3px solid #4ecca3;border-radius:8px;font-size:.92em;color:#bfe;line-height:1.5}
.c .od{display:block;margin-top:4px;font-size:.9em;color:#a8bcd1;font-style:normal;opacity:1}
.rg .rrep{font-size:.92em;color:#f0a500;background:#2a2410;border-radius:8px;padding:6px 11px;margin-bottom:7px;font-weight:bold}
.rg .rgloss{font-size:.8em;color:#889;margin-bottom:9px}
.rg .rw{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #0f3460;font-size:.95em}
.rg .rw:last-child{border-bottom:none}
.rg .rw .rwe{color:#fff;font-weight:bold;word-break:break-word}
.rg .rw .rwm{color:#8ab;font-size:.88em;text-align:right;word-break:break-word}
.bank{background:#1a2a52;border:1px solid #2a4a7a;border-radius:10px;padding:12px 14px;margin-bottom:15px;display:none}
.bank.on{display:block}
.bank .t{font-size:.93em;color:#f0a500;font-weight:bold;margin-bottom:8px}
.bank .r{display:flex;gap:7px}
.bank button{flex:1;padding:11px 8px;font-size:.95em;background:#f0a500;color:#1a1a2e}
.bank button:hover{background:#d4920a}
.bank button.clr{background:#0f3460;color:#889;border:1px solid #2a4a7a;flex:0 0 auto;padding:11px 14px}
.bank button.clr:hover{background:#3d1a1a;color:#e94560}

#stdash{margin-bottom:14px}
.dprog{background:#16234a;border:1px solid #24325a;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.dprogl{font-size:.85em;color:#c9d4e0;margin-bottom:6px}
.dprogl b{color:#e8eefc;font-size:1.1em}
.dbar{background:#0d1836;border-radius:6px;height:10px;overflow:hidden}
.dbar.sm{height:7px}

.dbarf.q{background:#5b9bd5}

.dprogp{text-align:right;font-size:.78em;color:#8899bb;margin-top:3px}
.dmode{display:flex;gap:8px;margin-bottom:8px}
.dmc{flex:1;background:#16234a;border:1px solid #24325a;border-radius:12px;padding:10px 12px}
.dmn{font-size:.8em;color:#c9d4e0}
.dmv{float:right;font-size:.85em;font-weight:bold;color:#e8eefc}
.dmc .dbar{margin-top:7px}
.dgrid2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dcell{background:#16234a;border:1px solid #24325a;border-radius:12px;padding:12px 6px;text-align:center}
.dcell .dn{font-size:1.5em;font-weight:bold;color:#e8eefc;line-height:1.1}
.dcell .dl{font-size:.72em;color:#8899bb;margin-top:3px}

.pinbtn{background:#16234a;border:1.5px solid #f0a500;color:#f0a500;border-radius:20px;padding:8px 18px;font-size:.9em;font-weight:600;cursor:pointer}
.pinbtn.pinned{background:#2a2410;border-color:#4ecca3;color:#4ecca3}
.pinbtn:active{transform:scale(.96)}

.repbox{margin-top:6px}
.reptog{background:#2a2410;border:1px solid #4a3f1a;color:#f0c060;border-radius:8px;padding:6px 12px;font-size:.85em;cursor:pointer;width:100%;text-align:left}

.repbody{margin-top:5px;font-size:.9em;color:#f0c060;background:#221d0d;border-radius:8px;padding:8px 12px;line-height:1.6}
.cmean{font-size:1.05em;color:#c9d4e0;margin:6px 0 4px;text-align:center}

/* 따라쓰기 가독성 개선 */
#copyscr .wd{font-size:2.1em;color:#f2f6ff;letter-spacing:.01em}

#copyscr .tag{font-size:.95em;color:#7d90ad}

#copyscr .fb{font-size:1.15em;font-weight:600}

  background:#111d3d;border:1px solid #26365e;border-radius:12px;margin:10px 0}
.sentpart{color:#dbe6f7}

#copyscr .qcard{padding-top:26px;padding-bottom:22px}
#copyscr .tag{font-size:.92em;color:#7d90ad;margin-bottom:18px}
#copyscr .wd{font-size:1.55em;color:#e9f0fc;font-weight:600;line-height:1.45;
  letter-spacing:.005em;margin-bottom:6px;text-align:center}
#copyscr .cmean{font-size:1.02em;color:#9db2d0;line-height:1.5;margin-bottom:4px;text-align:center}
#copyscr .ask{font-size:.98em;color:#8fa4c2;margin:18px 0 14px;text-align:center}
#copyscr #canswers{gap:11px;margin:0 0 22px}
/* 따라 쓸 항목: 단어를 크게, 뜻은 아래 작게 */
#copyscr .cans{display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:1em;padding:12px 20px;border-radius:12px;
  border:1.5px solid #33456e;background:#16234a;color:#dce8f8;min-width:96px}
#copyscr .canstxt{font-size:1.42em;font-weight:600;letter-spacing:.01em;line-height:1.25}
#copyscr .canssub{font-size:.8em;color:#8ba0c0;line-height:1.3}
#copyscr .canssub.main{color:#6f83a3;font-style:italic}
#copyscr .cans.cur{border-color:#f0a500;background:#221b08;
  box-shadow:0 0 14px rgba(240,165,0,.32)}
#copyscr .cans.cur .canstxt{color:#ffd479}
#copyscr .cans.cur .canssub{color:#c9a55f}
#copyscr .cans.done{border-color:#4ecca3;background:#10301f}
#copyscr .cans.done .canstxt{color:#6ee7b7}
#copyscr .cans.done .canssub{color:#7fbfa3}
#copyscr .cans.sent{flex-direction:row}
#copyscr .cans.sent .canstxt{font-size:1.08em;line-height:1.6;font-weight:500}
#copyscr #cinput{font-size:1.28em;padding:15px 18px;color:#f2f6ff}
#copyscr .fb{font-size:1.1em;font-weight:600;min-height:1.5em;margin-top:10px;text-align:center}

/* 선지 번호 배지 (키보드 숫자키와 대응) */
.c{display:flex;align-items:center;gap:11px;text-align:left}
.onum{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:7px;background:#22335c;color:#9fb4d6;
  font-size:.85em;font-weight:700;line-height:1}
.otxt{flex:1 1 auto}
.c.sel .onum{background:#f0a500;color:#1a1205}
.c.ok .onum{background:#4ecca3;color:#06251a}
.c.no .onum{background:#c0392b;color:#fff}

/* 따라쓰기 레이아웃 v3: 뜻과 단어를 한 덩어리로 (시선 이동 최소화) */
#copyscr #cask{display:none}                 /* 안내 문구 제거 (혼자 쓰는 앱) */
#copyscr .qcard{padding-top:20px;padding-bottom:20px}
#copyscr .tag{margin-bottom:10px;font-size:.88em;color:#6f83a3}
#copyscr .wd{font-size:1.5em;margin-bottom:2px;line-height:1.35}
#copyscr .cmean{font-size:.95em;margin-bottom:0;color:#93a7c4}
#copyscr #canswers{margin-top:10px;margin-bottom:16px;gap:9px}
#copyscr #cinput{margin-top:0}
#copyscr .fb{margin-top:6px;min-height:0}
#copyscr .fb:empty{margin:0}
/* 빈칸 예문도 뜻 바로 아래 */
#copyscr .blanksent{margin-top:10px;margin-bottom:14px}

/* 따라쓰기 어원 (입력창 아래 참고용) */
.croot{margin-top:12px;padding:11px 14px;background:#131f42;border:1px solid #24325a;
  border-radius:11px;font-size:.95em;line-height:1.65;color:#b9cbe6;text-align:left}
.crootlabel{display:inline-block;background:#22335c;color:#8fa8cc;font-size:.8em;
  padding:2px 8px;border-radius:6px;margin-right:8px;vertical-align:middle}
.crootrep{margin-top:7px;font-size:.9em;color:#e0b968}

#copyscr .cans.skip{border-color:#3a4560;background:#1a2138}
#copyscr .cans.skip .canstxt{color:#9fb0c9}
#copyscr .cans.skip .canssub{color:#7182a0}

/* 동의어 어원 보기 */
#copyscr .cans.hasroot{cursor:pointer}
#copyscr .rootdot{font-size:.62em;color:#e0b968;margin-left:5px;vertical-align:super;opacity:.85}
#copyscr .cans.hasroot:active{transform:scale(.98)}
.crootback{margin-top:9px;font-size:.9em;color:#8fa8cc;cursor:pointer;display:inline-block;
  padding:4px 10px;background:#1b2b50;border-radius:7px}

/* 동의어 매칭 입력 모드 */
#synmodebar{text-align:right;margin-bottom:10px}
.modetog{background:#1b2b50;border:1.5px solid #2f4270;color:#9fb4d6;border-radius:20px;
  padding:8px 16px;font-size:.92em;font-weight:600;cursor:pointer}
.modetog.on{background:#22335c;border-color:#f0a500;color:#ffd479}
#syninput{font-size:1.25em;padding:14px 16px}
/* 입력 모드일 때 보기를 가로 2~3열로 (큼직하게 유지하면서 세로 길이 축소) */
.ch.typing{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ch.typing .c{font-size:1.15em;padding:14px 12px;justify-content:center;text-align:center}
.ch.typing .c .onum{width:24px;height:24px;font-size:.8em}
@media(min-width:700px){ .ch.typing{grid-template-columns:repeat(3,1fr)} }

/* 따라쓰기 집중형 레이아웃 */
#cfocus{margin:14px 0 10px}
.focusitem{cursor:pointer;display:inline-block;padding:18px 30px;border-radius:16px;
  background:#182a55;border:2px solid #f0a500;box-shadow:0 0 22px rgba(240,165,0,.28);
  min-width:220px}
.focustxt{font-size:2.05em;font-weight:700;color:#ffd479;line-height:1.25;letter-spacing:.01em}
.focuslabel{margin-top:5px;font-size:.92em;color:#c9a55f}
.focusitem.sent .focustxt{font-size:1.2em;line-height:1.55;font-weight:500}
#cdots{margin:12px 0 4px;display:flex;gap:8px;justify-content:center}
#cdots .dot{width:9px;height:9px;border-radius:50%;background:#2a3a5f;display:inline-block}
#cdots .dot.on{background:#4ecca3}
#cdots .dot.now{background:#f0a500;box-shadow:0 0 8px rgba(240,165,0,.6)}
#cblanksent{margin-top:12px}
#copyscr .rootdot{font-size:.5em;vertical-align:super;margin-left:6px}

/* ── 따라쓰기 레이아웃 C: 위=칠 것 / 아래=참고, 왼쪽 정렬 ── */
#copyscr .qcard{padding:22px 20px;text-align:left}
#copyscr .tag{text-align:left;margin-bottom:16px;font-size:.9em;color:#6f83a3}

/* 지금 칠 것 */
#cfocus{margin:0 0 14px;text-align:left}
#cfocus .focusitem{cursor:pointer;display:block;background:none;border:none;box-shadow:none;padding:0;min-width:0}
#cfocus .focustxt{font-size:2.3em;font-weight:700;color:#ffd479;line-height:1.2;
  letter-spacing:.005em;text-shadow:0 0 18px rgba(240,165,0,.25)}
#cfocus .focuslabel{margin-top:6px;font-size:1.05em;color:#a8bcd8}
#cfocus .focusitem.sent .focustxt{font-size:1.25em;line-height:1.6;font-weight:600}

/* 빈칸 예문 */
#cblanksent{margin:0 0 16px}
#cblanksent .blanksent{text-align:left;font-size:1.22em;line-height:2}

/* 입력창 */
#copyscr .winrow{margin:0}
#copyscr #cinput{font-size:1.3em;padding:15px 16px}

/* 진행 점 */
#cdots{margin:14px 0 0;justify-content:flex-start}

/* 아래 참고 영역 */
#crefbox{margin-top:20px;padding-top:16px;border-top:1px solid #223055}
#cmainline{font-size:1.05em;color:#c3d3ea;margin-bottom:10px;line-height:1.5}
#cmainline #cword{font-weight:700;color:#e8f0fc;margin-right:8px}
#cmainline #cmean{color:#93a7c4;font-size:.95em}
#copyscr .croot{margin-top:0;background:#111d3d;text-align:left;font-size:.95em;line-height:1.7}

/* 복습 버튼 왼쪽으로 */
#copyscr .pinbtn{margin-top:0}

/* 진행 카운터 (단어 옆) */
.focusnum{font-size:.42em;font-weight:600;color:#8ba0c0;margin-left:12px;vertical-align:middle;
  background:#1b2b50;padding:4px 10px;border-radius:20px;letter-spacing:0}
/* 입력창 placeholder(정답 흐리게) */
#copyscr #cinput::placeholder{color:#4a5f85;opacity:1}
/* 완료 순간 색 피드백 */
#copyscr .qcard.donef{box-shadow:0 0 0 2px #4ecca3 inset;transition:box-shadow .2s}
#copyscr .qcard.donef .focustxt{color:#6ee7b7;transition:color .25s}
/* 항목 전환 애니메이션 */
@keyframes cslide{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#copyscr .qcard.slidein #cfocus{animation:cslide .22s ease-out}
/* 어원 접기 */
.crooth{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.crootarrow{color:#8fa8cc;font-size:.9em;margin-left:8px}
.crootb{margin-top:8px}

.crootkey{margin-left:7px;font-size:.82em;color:#6f83a3;background:#1b2b50;padding:2px 7px;border-radius:5px}

/* 어원 요청 */
.reqrow{margin-top:10px}
.reqbtn{background:#1b2b50;border:1.5px solid #2f4270;color:#9fb4d6;border-radius:9px;
  padding:8px 14px;font-size:.9em;cursor:pointer}
.reqbtn.on{background:#12331f;border-color:#4ecca3;color:#6ee7b7}
.bank.req{border-color:#4a3f6a!important;background:#1d1a33!important}
.bank.req .t{color:#c3a6f0}
#reqArea{width:100%;margin-top:10px;min-height:78px;background:#141126;color:#d7cdf0;
  border:1px solid #3a3260;border-radius:9px;padding:10px;font-size:.92em;line-height:1.6;resize:vertical}

/* ── 넓은 화면: 왼쪽 입력 / 오른쪽 목록·어원 ── */
#copyscr .qcard{max-width:100%}
@media(min-width:900px){
  #copyscr .qcard{display:grid;grid-template-columns:1fr 400px;
    grid-template-rows:auto auto auto auto auto 1fr;
    column-gap:36px;row-gap:0;align-items:start;
    max-width:1100px;margin:0 auto;padding:26px 30px}
  #copyscr .tag{grid-column:1/-1;grid-row:1}
  #cblanksent{grid-column:1;grid-row:2}
  #cfocus{grid-column:1;grid-row:3}
  #copyscr .winrow{grid-column:1;grid-row:4}
  #copyscr .fb{grid-column:1;grid-row:5}
  #cdots{grid-column:1;grid-row:6;align-self:start}
  #canswers{grid-column:2;grid-row:2/4;margin:0 0 16px}
  #crefbox{grid-column:2;grid-row:4/7;margin-top:0;padding-top:0;border-top:none;
    border-left:1px solid #223055;padding-left:26px}
}
/* 항목 목록: 항상 보이되 현재 것만 강조 */
#canswers{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}
#canswers .cans{opacity:.45;transform:scale(.97);transition:all .22s;
  padding:9px 14px;font-size:.98em}
#canswers .cans.cur{opacity:1;transform:scale(1);border-color:#f0a500;
  background:#221b08;box-shadow:0 0 14px rgba(240,165,0,.3)}
#canswers .cans.done{opacity:.75;border-color:#4ecca3;background:#10301f}
#canswers .cans .canstxt{font-size:1.05em}
#canswers .cans .canssub{font-size:.8em}

/* 칠 단어 밑 메인 참고 */
.focusmain{margin-top:10px;font-size:1.02em;color:#93a7c4;line-height:1.5}
.focusmain b{color:#dbe6f7;font-weight:700;margin-right:4px}

/* 오른쪽 메인 단어 크게 */
#cmainline{font-size:1.5em!important;color:#e8f0fc!important;margin-bottom:14px!important;line-height:1.4}
#cmainline #cword{font-weight:800;color:#ffd479;font-size:1.15em;display:block;margin-bottom:4px}
#cmainline #cmean{color:#a8bcd8;font-size:.62em;display:block}

/* 입력창 완료 효과 (화면 전체 → 입력창만) */
@keyframes inpdone{
  0%{box-shadow:0 0 0 0 rgba(78,204,163,.65); background:#12331f}
  60%{box-shadow:0 0 0 10px rgba(78,204,163,0); background:#143d26}
  100%{box-shadow:0 0 0 0 rgba(78,204,163,0)}
}
#copyscr #cinput.donef{animation:inpdone .9s ease-out;border-color:#4ecca3!important;color:#6ee7b7}

/* 입력창을 위로 (칠 단어 바로 아래) */
#cfocus{margin-bottom:10px}
#copyscr .winrow{margin-top:2px}
#cdots{margin-top:10px}

/* 넓은 화면 전용 모드 (아이패드·노트북) */
@media(min-width:900px){
  #copyscr .qcard{grid-template-columns:1fr 400px;gap:36px}
  #cfocus .focustxt{font-size:2.5em}
}

#cfocus{margin:0 0 12px}
#copyscr .winrow{margin-top:0}
#copyscr .fb{margin-top:8px;min-height:0}
.focusmain{margin-top:9px;margin-bottom:0}

#cfocus .focuslabel{font-size:1.12em;color:#a8bcd8;line-height:1.5;margin-top:8px}

#canswers .cans{max-width:100%}
#canswers .canssub{white-space:normal;line-height:1.35;word-break:keep-all}
#canswers .canssub.main{color:#8ba0c0;font-style:normal}

/* 긴 뜻 대비: 오른쪽 참고 영역은 전체 표시 + 필요시 스크롤 */
#cmainline #cmean{max-height:150px;overflow-y:auto;line-height:1.55}
#canswers .canssub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#cfocus .focuslabel{max-height:76px;overflow:hidden}

/* ── 긴 뜻도 전부 보이게: 뜻은 상단 전체 폭, 왼쪽은 입력에만 집중 ── */
@media(min-width:900px){
  #copyscr .qcard{
    grid-template-rows:auto auto auto auto auto auto 1fr;
  }
  /* 뜻(라벨)을 상단 전체 폭으로 빼서 왼쪽이 밀리지 않게 */
  #cfocus{grid-column:1;grid-row:3}
}
/* 라벨(뜻) 잘림 해제 + 읽기 좋게 */
#cfocus .focuslabel{max-height:none;overflow:visible;font-size:1.1em;line-height:1.6;
  color:#a8bcd8;margin-top:9px;max-width:620px}
.focusmain{max-width:620px;line-height:1.55}
/* 목록 칩: 뜻 전체 표시하되 칩 폭 제한해 줄바꿈 */
#canswers .canssub{-webkit-line-clamp:unset;display:block;overflow:visible;
  white-space:normal;line-height:1.4;max-width:330px}
#canswers .cans{align-items:flex-start;text-align:left}
#canswers .cans .canstxt{text-align:left}
/* 오른쪽 메인 뜻 전체 표시 */
#cmainline #cmean{max-height:none;overflow:visible}

/* ── 넓은 화면(아이패드·노트북)에서 퀴즈/쓰기 화면을 넓게 ── */
@media(min-width:900px){
  #qscr, #writescr, #browsescr, #rootscr, #statsscr{max-width:1000px}
  #qscr .box, #writescr .box{padding:26px 30px}
  /* 사지선다·동의어 선지: 2열로 배치해 한 줄이 짧아지게 */
  #ch{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  #ch .c{font-size:1.12em;padding:15px 18px;line-height:1.6}
  #ch .c .otxt{line-height:1.6}
  /* 문제 단어·안내 크게 */
  #qscr .wd{font-size:2.1em}
  #qscr .ask{font-size:1.05em}
  /* 입력 모드에선 3열까지 */
  .ch.typing{grid-template-columns:repeat(3,1fr)!important}
  #syninput{font-size:1.3em;padding:16px 18px}
  /* 정답 해설(뜻·동의어) 읽기 좋게 */
  #qscr .info{font-size:1.05em;line-height:1.75;padding:16px 20px}
  #qscr .info .m{font-size:1.05em;line-height:1.7}
  #qscr .info .s{font-size:1em;line-height:1.8}
  /* 동의어 쓰기 모드 */
  #writescr .wd{font-size:2.1em}
  #winput{font-size:1.3em;padding:16px 18px}
  #writescr .info{font-size:1.05em;line-height:1.75}
}
/* 아주 넓은 화면: 선지 3열 */
@media(min-width:1280px){
  #qscr, #writescr{max-width:1150px}
  #ch{grid-template-columns:repeat(3,1fr)}
}
/* 긴 한국어 뜻 줄바꿈 자연스럽게 */
#ch .c .otxt{word-break:keep-all;overflow-wrap:break-word}
#qscr .info .m, #qscr .info .s{word-break:keep-all}

/* ── 아이패드·노트북: 전체 화면을 넓고 크게 ── */
@media(min-width:900px){
  h1{font-size:2em!important;margin-bottom:4px}
  .sub{font-size:1.05em!important}
  .panel, #msg, .scr{max-width:1000px}
  #setup{padding:26px 30px}
  /* 학습 모드 버튼을 2열로 — 세로가 짧아지고 글자도 커짐 */
  #mseg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  #mseg button{font-size:1.05em;padding:16px 18px}
  #mseg button .t{font-size:1.12em}
  #mseg button .d{font-size:.92em;margin-top:3px}
  /* 진도·출제대상·문항수를 가로로 나란히 */
  .fld{margin-bottom:16px}
  .fld label{font-size:1.02em}
  #dsel{font-size:1.05em;padding:13px 14px}
  .seg button{font-size:1em;padding:13px 10px}
  #go{font-size:1.2em!important;padding:18px!important}
  /* 배너(오답·복습·요청) 크게 */
  .bank{padding:16px 20px}
  .bank .t{font-size:1.05em}
  .bank .r button{font-size:1em;padding:11px 16px}
  /* 통계·훑어보기·어근 화면도 넓게 */
  #statsscr, #browsescr, #rootscr{max-width:1100px}
  #stlist, #brlist{font-size:1.03em}
  .dgrid2{gap:12px}
  .dcell .dn{font-size:1.8em}
  .dcell .dl{font-size:.85em}
}
@media(min-width:1280px){
  .panel, #msg, .scr{max-width:1150px}
  #mseg{grid-template-columns:repeat(3,1fr)}
}

/* 정답 공개 후 단어 옆 뜻 */
#qwmean{font-size:.46em;font-weight:500;color:#9fb4d6;margin-left:12px;
  letter-spacing:0;line-height:1.5;word-break:keep-all}
@media(min-width:900px){ #qwmean{font-size:.42em} }

/* 퀴즈: 정답 공개 후 선지 어원 조회 */
#ch .c.rootable{cursor:pointer}
#ch .c.hasroot .rootdot{font-size:.72em;color:#e0b968;margin-left:6px;vertical-align:super}
#qroot{margin-top:12px}

/* 담아둔 단어 목록 */
#pinList{margin-top:12px;max-height:280px;overflow-y:auto;
  background:#12203f;border:1px solid #24325a;border-radius:10px;padding:8px}
.pinrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px}
.pinrow:nth-child(odd){background:#16264a}
.pinrow .pw{font-weight:700;color:#e8f0fc;min-width:120px}
.pinrow .pm{flex:1;color:#9fb4d6;font-size:.92em;word-break:keep-all}
.pinrow .pdel{background:#2a1a1a;border:1px solid #5a2a2a;color:#e88;
  border-radius:6px;padding:4px 9px;font-size:.85em;cursor:pointer}
.pinrow .pdel:active{transform:scale(.94)}

/* ── 따라쓰기 가독성 개선 v2 ── */
@media(min-width:900px){
  /* 왼쪽: 뜻·참고 크게 */
  #cfocus .focuslabel{font-size:1.32em;color:#c3d6f0}
  .focusmain{font-size:1.12em;color:#a8bcd8}
  .focusmain b{color:#e8f0fc}
  /* 오른쪽 목록: 글자 키우기 */
  #canswers .cans{padding:12px 16px}
  #canswers .cans .canstxt{font-size:1.3em}

<script>
'use strict';
var IDX=null, refreshUnitLabels=function(){}, CACHE={}, POOL={words:[],phrases:[],all:[]}, SET=[], LEX={}, ROOTS=null;
var st={mode:'syn', key:null, cum:false, set:0, n:50, target:'word'};
var MOPUP=false;      // 미풀이 정리 모드
var SYN_TYPING=false;   // 동의어 매칭 입력 모드
var Q=[], qi=0, ans=[], wrongs=[], fin=false, sel={};
var SRC='normal';   // normal | retry | bank
var BANK={quiz:{}, syn:{}};   // 즉각 복습용 누적 오답: mode -> {word: item}
var STATS={};   // 장기 통계: word -> {w, m, s, p, r, id, vol, day, type, wrong, right}
var CI=0;

function $(i){return document.getElementById(i);}
function msg(t,c){var m=$('msg');m.textContent=t;m.className=c||'load';m.style.display='block';}
function hide(){$('msg').style.display='none';}
var SCREENS=['setup','cardscr','qscr','resscr','browsescr','rootscr','statsscr','writescr','copyscr','calscr','penscr'];
function show(id){
  var target=$(id);
  if(!target){                       // 없는 화면 요청 → 화면이 비는 사고 방지
    __showErr('화면 "'+id+'"이 없습니다. 메뉴로 돌아갑니다.');
    id='setup'; target=$('setup');
    if(!target) return;
  }
  SCREENS.forEach(function(s){ var el=$(s); if(el) el.classList.remove('on'); });
  target.classList.add('on');
  __lastStep='화면표시:'+id;
  window.scrollTo(0,0);
  // 홈으로 돌아올 땐 배너·라벨을 항상 최신으로 (새로고침 없이 반영)
  if(id==='setup'){
    try{
      if(typeof bankUI==='function') bankUI();
      if(typeof statsUI==='function') statsUI();
      if(typeof resumeUI==='function') resumeUI();
      if(typeof srsUI==='function') srsUI();
      if(typeof reqUI==='function') reqUI();
      if(typeof todayUI==='function') todayUI();
      if(typeof syncUI==='function') syncUI();
      if(typeof refreshUnitLabels==='function') refreshUnitLabels();
    }catch(e){}
  }
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 뜻 토큰화 (첫 갈래 기준)
var _tkCache={};
function mtoks(m){
  if(_tkCache[m]) return _tkCache[m];
  var t = m.split(/[\/;]/)[0];
  t = t.replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/[,·]/g,' ');
  var out={}, n=0;
  t.split(/\s+/).forEach(function(c){
    if(!/[가-힣]/.test(c)) return;
    var b=c.replace(/(하다|되다|시키다|스러운|스럽다|롭다|적인|의|한|는|을|를|이|가|함|음)$/,'');
    if(b.length>=2 && !out[b]){ out[b]=1; n++; }
  });
  var r={set:out, n:n};
  _tkCache[m]=r;
  return r;
}
// 두 뜻이 너무 비슷한가 (Jaccard >= 0.5)
function tooSimilar(a,b){
  var A=mtoks(a), B=mtoks(b);
  if(!A.n||!B.n) return false;
  var inter=0;
  for(var k in A.set) if(B.set[k]) inter++;
  var uni=A.n+B.n-inter;
  return uni>0 && (inter/uni) >= 0.5;
}
// 두 뜻이 같은 계열인가 (뜻 토큰이 하나라도 겹치면 true → 오답에서 제외)
function shareMeaning(a,b){
  var A=mtoks(a), B=mtoks(b);
  if(!A.n||!B.n) return false;
  for(var k in A.set) if(B.set[k]) return true;  // 핵심 뜻 토큰 하나라도 공유
  return false;
}
// (미사용) 뜻 관계 판정 - 함정 로직 제거로 더는 안 씀
function meaningRel(a,b){
  var A=mtoks(a), B=mtoks(b);
  if(!A.n||!B.n) return 'unknown';
  var inter=0;
  for(var k in A.set) if(B.set[k]) inter++;
  if(inter===0) return 'different';
  var uni=A.n+B.n-inter;
  var jac=inter/uni;
  // 거의 동일: 자카드 매우 높거나, 한쪽이 다른쪽에 완전 포함되고 크기 비슷
  if(jac>=0.8) return 'identical';
  if((inter===A.n||inter===B.n) && Math.abs(A.n-B.n)<=1) return 'identical';
  // 일부만 겹침 = 헷갈리는 함정
  return 'similar';
}

    if(w.s&&w.s.length) h+='<div class="s">'+synHTML(w.s)+'</div>';
    return h;
  }
  var out='';
  w.p.forEach(function(p){
    var on = (hl && p.d===hl);
    out += '<div class="pr'+(on?' hl':'')+'">'
         + '<span class="pd">'+esc(p.d)+'</span>'
         + '<span class="ps">'+synHTML(p.s)+'</span></div>';
  });
  out += usageHTML(w);
  out += prepHTML(w);
  // 동의어가 없는 나머지 뜻
  var covered = w.p.map(function(p){return p.d;}).join(' / ');
  if(w.m && w.m !== covered){
    var rest = w.m.split(' / ').filter(function(t){
      return !w.p.some(function(p){ return p.d.indexOf(t)>=0; });
    });
    if(rest.length) out += '<div class="pr"><span class="pd">'+esc(rest.join(' / '))+'</span></div>';
  }
  return out;
}

// 단어 풀·키에서 복구되는 필드는 올리지 않는다
var GH_HEAVY = ['m','s','p','r','type','pp','ug','uf','w','id','vol','day'];
function ghSlimRec(rec){
  if(!rec || typeof rec!=='object') return rec;
  var o={};
  for(var k in rec){
    if(GH_HEAVY.indexOf(k)>=0) continue;
    var v=rec[k];
    if(v===0 || v===false || v===null || v===undefined || v==='') continue;  // 기본값은 생략
    o[k]=v;
  }
  return o;
}
function ghSlimMap(m){
  var o={};
  for(var k in (m||{})) o[k]=ghSlimRec(m[k]);
  return o;
}
// 단어 이름으로 원본 찾기 (풀이 아직 없으면 null)
var _poolByName=null;
function ghPoolFind(name){
  var pool=(typeof _allPool!=='undefined'&&_allPool)||(typeof POOL!=='undefined'&&POOL&&POOL.all)||null;
  if(!pool||!pool.length) return null;
  if(!_poolByName || _poolByName._n!==pool.length){
    _poolByName={_n:pool.length};
    for(var i=0;i<pool.length;i++) _poolByName[String(pool[i].w).toLowerCase().trim()]=pool[i];
  }
  return _poolByName[String(name).toLowerCase().trim()]||null;
}
// 빠진 필드를 로컬 기존 기록 → 단어 풀 순으로 채움
function ghFatten(rec, key, localRec){
  if(!rec || typeof rec!=='object') return rec;
  var src = localRec || ghPoolFind(rec.w || key);
  if(src){
    for(var i=0;i<GH_HEAVY.length;i++){
      var f=GH_HEAVY[i];
      if(rec[f]===undefined && src[f]!==undefined) rec[f]=src[f];
    }
    var BASE=['w','id','vol','day'];
    for(var j=0;j<BASE.length;j++){
      var g=BASE[j];
      if(rec[g]===undefined && src[g]!==undefined) rec[g]=src[g];
    }
  }
  if(rec.w===undefined) rec.w=key;
  if(rec.wrong===undefined) rec.wrong=0;
  if(rec.right===undefined) rec.right=0;
  return rec;
}
function ghFattenMap(m, localMap){
  for(var k in (m||{})) m[k]=ghFatten(m[k], k, (localMap||{})[k]);
  return m;
}

// 두 기록을 합치기 (양쪽에서 푼 것이 모두 남게)
function ghMerge(local, remote){
  if(!remote) return local;
  var out={v:1, t:Date.now(), stats:{}, bank:{quiz:{},syn:{}}, daily:{}, pen:{}, memo:{}, req:{}};
  // STATS: 횟수는 큰 값, 시각/상태는 최신 것
  var ks={};
  for(var k in (local.stats||{})) ks[k]=1;
  for(var k2 in (remote.stats||{})) ks[k2]=1;
  for(var w in ks){
    var a=(local.stats||{})[w], b=(remote.stats||{})[w];
    if(!a){ out.stats[w]=b; continue; }
    if(!b){ out.stats[w]=a; continue; }
    var newer = ((a.last||a.due||0) >= (b.last||b.due||0)) ? a : b;
    var m={};
    for(var f in newer) m[f]=newer[f];
    m.wrong = Math.max(a.wrong||0, b.wrong||0);
    m.right = Math.max(a.right||0, b.right||0);
    m.streak = newer.streak||0;
    m.due = Math.max(a.due||0, b.due||0);
    m.pinned = (a.pinned||b.pinned) ? 1 : 0;
    if(a.seen_syn||b.seen_syn) m.seen_syn=1;
    if(a.seen_quiz||b.seen_quiz) m.seen_quiz=1;
    out.stats[w]=m;
  }
  // BANK: 합집합
  ['quiz','syn'].forEach(function(mode){
    var la=(local.bank||{})[mode]||{}, rb=(remote.bank||{})[mode]||{};
    for(var x in la) out.bank[mode][x]=la[x];
    for(var y in rb) if(!out.bank[mode][y]) out.bank[mode][y]=rb[y];
  });
  // DAILY: 날짜별로 큰 값
  var ds={};
  for(var d1 in (local.daily||{})) ds[d1]=1;
  for(var d2 in (remote.daily||{})) ds[d2]=1;
  for(var dk in ds){
    var la2=(local.daily||{})[dk]||{syn:0,copy:0}, rb2=(remote.daily||{})[dk]||{syn:0,copy:0};
    out.daily[dk]={syn:Math.max(la2.syn||0, rb2.syn||0), copy:Math.max(la2.copy||0, rb2.copy||0)};
  }
  // pen/memo/req: 합집합 (memo는 최신 것)
  function mergeMap(a,b,byTime){
    var o={}, s={};
    for(var k in (a||{})) s[k]=1;
    for(var k2 in (b||{})) s[k2]=1;
    for(var k3 in s){
      var x=(a||{})[k3], y=(b||{})[k3];
      if(!x){ o[k3]=y; continue; }
      if(!y){ o[k3]=x; continue; }
      o[k3] = byTime ? (((x.u||x.t||0)>=(y.u||y.t||0))?x:y) : x;
    }
    return o;
  }
  out.pen=mergeMap(local.pen, remote.pen);
  out.memo=mergeMap(local.memo, remote.memo, true);
  out.req=mergeMap(local.req, remote.req);
  out.diary=mergeMap(local.diary, remote.diary, true);
  // 세션: 같은 강이면 최신 것만, 다른 강이면 둘 다 유지
  out.ses={};
  (function(){
    var s={}, a=local.ses||{}, b=remote.ses||{};
    for(var k in a) s[k]=1;
    for(var k2 in b) s[k2]=1;
    for(var k3 in s){
      var x=a[k3], y=b[k3];
      if(!x){ out.ses[k3]=y; continue; }
      if(!y){ out.ses[k3]=x; continue; }
      out.ses[k3] = ((x.ts||0)>=(y.ts||0)) ? x : y;   // 최신 시각 승
    }
  })();
  return out;
}
function ghApply(d){

  // 압축본이 올 수 있으므로, 기존 로컬 기록 → 단어 풀 순으로 빠진 필드를 되채운다
  if(d.stats) { var _ls=STATS||{}; STATS=ghFattenMap(d.stats, _ls); statsSave(); }

    d.bank.syn =ghFattenMap(d.bank.syn ||{}, _lb.syn ||{});

  if(d.pen)   { var _lp=PENLIST||{}; PENLIST=ghFattenMap(d.pen, _lp); penSave(); }
  if(d.memo)  { MEMO=d.memo; memoSave(); }

  if(d.diary) { DIARY=d.diary; diarySave(); }
  if(d.ses)   { SESSIONS=d.ses; sessionsSave(); }
}

function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,'')))); }
// ── gzip 압축 (GitHub Contents API 1MB 제한 대응) ──
// 브라우저가 지원하면 gzip 후 올리고, 받을 때 매직바이트(1f 8b)로 알아서 판별한다.
// 지원 안 하면 예전처럼 평문 JSON으로 올린다 (기존 파일과도 호환).
function bytesToB64(u8){
  var s='', CH=0x8000;
  for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return btoa(s);
}
function b64ToBytes(b64){
  var bin=atob(String(b64).replace(/\n/g,''));
  var u8=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return u8;
}
function ghEncode(text){
  if(typeof CompressionStream==='undefined') return Promise.resolve(b64enc(text));
  try{
    var cs=new CompressionStream('gzip');
    var st=new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(cs);
    return new Response(st).arrayBuffer()
      .then(function(buf){ return bytesToB64(new Uint8Array(buf)); })
      .catch(function(){ return b64enc(text); });
  }catch(e){ return Promise.resolve(b64enc(text)); }
}
function ghDecode(b64){
  var u8;
  try{ u8=b64ToBytes(b64); }catch(e){ return Promise.resolve(b64dec(b64)); }
  if(!(u8.length>2 && u8[0]===0x1f && u8[1]===0x8b)) return Promise.resolve(b64dec(b64));  // 평문
  if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('이 브라우저는 압축 해제를 지원하지 않아요'));
  var ds=new DecompressionStream('gzip');
  var st=new Blob([u8]).stream().pipeThrough(ds);
  return new Response(st).text();
}

// 원격에서 가져와 합치고, 다시 올리기
function ghErrText(status, body){
  var b='';
  try{ var j=JSON.parse(body); b=j.message||''; }catch(e){ b=String(body||'').slice(0,80); }
  if(status===401) return '토큰이 잘못됐거나 만료됐어요 (401)';
  if(status===403) return '권한이 없어요 — 토큰 권한(Contents: Read and write)을 확인해 주세요 (403)';
  if(status===404) return '저장소를 찾을 수 없어요 — 사용자·저장소 이름을 확인해 주세요 (404)';
  if(status===409) return '다른 기기와 충돌했어요 (409)';
  if(status===422) return '저장 파일이 너무 크거나 형식이 안 맞아요 (422)' + (b?' · '+b:'');
  return '오류 '+status + (b?' · '+b:'');
}
function ghSync(silent, _retry){
  if(!ghReady()){ if(!silent) syncMsg('토큰을 먼저 등록해 주세요','err'); return Promise.resolve(false); }
  if(!silent) syncMsg('동기화 중…','load');
  var remote=null;
  return ghApi('GET').then(function(r){
    if(r.status===404){ GH.sha=''; return null; }        // 아직 파일 없음 → 새로 만듦
    if(!r.ok) return r.text().then(function(t){ throw new Error(ghErrText(r.status, t)); });
    return r.json();
  }).then(function(meta){
    if(!(meta && meta.content)) return null;
    GH.sha=meta.sha;
    return ghDecode(meta.content)
      .then(function(txt){ try{ remote=JSON.parse(txt); }catch(e){ remote=null; } })
      .catch(function(){ remote=null; });
  }).then(function(){
    var merged=ghMerge(ghSnapshot(), remote);
    ghApply(merged);
    return ghEncode(JSON.stringify(merged));
  }).then(function(content){
    var body={message:'voca sync '+new Date().toISOString(), content:content};
    if(GH.sha) body.sha=GH.sha;
    return ghApi('PUT', body);
  }).then(function(r){
    if(!r) return false;
    if(!r.ok){
      // sha 충돌(409/422)이면 최신 sha 받아 한 번 더
      if((r.status===409 || r.status===422) && !_retry){
        GH.sha='';
        return ghSync(silent, true);
      }
      return r.text().then(function(t){ throw new Error(ghErrText(r.status, t)); });
    }
    return r.json();
  }).then(function(j){
    if(j===true || j===false) return j;                  // 재시도 결과 그대로
    if(j && j.content) GH.sha=j.content.sha;
    GH.last=Date.now(); ghSave();
    if(!silent) syncMsg('동기화 완료 · '+new Date().toLocaleTimeString(),'ok');
    syncUI();
    return true;
  }).catch(function(e){
    var m = (e && e.message) ? e.message : '알 수 없는 오류';
    if(String(m).indexOf('Failed to fetch')>=0 || String(m).indexOf('NetworkError')>=0)
      m='인터넷 연결을 확인해 주세요';
    syncMsg('❌ '+m,'err');                                // 자동 저장 실패도 표시
    return false;
  });
}

// 간격반복(SRS): 연속 정답 단계별로 복습 간격을 늘림 (분 단위)
var SRS_STEPS=[0, 1440, 4320, 10080, 21600, 43200]; // 0분,1일,3일,7일,15일,30일
function srsSchedule(rec, correct){
  var now=Date.now();
  if(correct){
    rec.streak=(rec.streak||0)+1;
    var step=Math.min(rec.streak, SRS_STEPS.length-1);
    rec.due=now + SRS_STEPS[step]*60000;
  } else {
    rec.streak=0;
    rec.due=now + 10*60000; // 틀리면 10분 뒤 다시
  }
  rec.last=now;
}
function statsEnsure(w){
  var k=w.w;
  if(!STATS[k]) STATS[k]={w:w.w, m:w.m, s:w.s, p:w.p, r:w.r, id:w.id, vol:w.vol, day:w.day, type:w.type, pp:w.pp, ug:w.ug, uf:w.uf, wrong:0, right:0};
  return STATS[k];
}
function statsWrong(w, mode){
  var r=statsEnsure(w);
  r.wrong++;
  if(mode==='syn'){
    r.cyc=(r.cyc||0)+1;                // 이번 사이클에서 틀린 횟수 (20개 선별용)
    dailyAdd('syn');                    // 푼 문항 수 (오답 재풀이 포함)
  }
  if(mode) r['seen_'+mode]=1;  // 이 모드로 풀어봤음 표시
  srsSchedule(r, false);
  statsSave();
}
function statsRight(w, mode){
  var r=statsEnsure(w);
  r.right++;
  if(mode==='syn') dailyAdd('syn');
  if(mode) r['seen_'+mode]=1;
  srsSchedule(r, true);
  statsSave();
}
// 복습 대상: due(다음 복습 시각)가 지난 단어들, 급한 순
function srsDue(){
  var now=Date.now(), o=[];
  for(var k in STATS){
    var r=STATS[k];
    if(r.due && r.due<=now && r.wrong>0) o.push(r);
  }
  o.sort(function(a,b){ return a.due-b.due; });
  return o;
}
function statsList(){
  var o=[];
  for(var k in STATS) o.push(STATS[k]);
  // 틀린 횟수 많은 순, 같으면 정답 적은 순
  o.sort(function(a,b){ return (b.wrong-a.wrong) || (a.right-b.right); });
  return o;
}

// 강별 통계: 동의어 매칭(seen_syn) 기준으로 완료·정답률 계산
// key 예: 'v1d01' → vol=1, day=1 / 'mvp1' 등은 vol 매핑 별도
function unitStats(key, totalN){
  var m=key.match(/^v(\d)d(\d+)$/);
  var vol=null, day=null;
  if(m){ vol=parseInt(m[1]); day=parseInt(m[2]); }
  var seenSyn=0, correct=0, attempts=0, unsolved=0;
  for(var k in STATS){
    var r=STATS[k];
    // 이 강 소속인지 (vol/day 일치). mvp 등은 key로 직접 비교 불가하므로 skip
    if(vol!==null){ if(r.vol!==vol || r.day!==day) continue; }
    else continue;  // v#d## 형식만 지원 (mvp는 완료표시 생략)
    if(!r.seen_syn) continue;   // 동의어 매칭으로 푼 것만
    seenSyn++;
    correct += (r.right||0);
    attempts += (r.right||0)+(r.wrong||0);
    // 아직 안 풀린 오답: 틀린 이력 있고 마지막이 미해결(streak 0 이면서 wrong>0)
    if((r.wrong||0)>0 && (r.streak||0)===0) unsolved++;
  }
  var acc = attempts? Math.round(correct/attempts*100) : null;
  // 완료: 그 강 전체(totalN)를 동의어 매칭으로 다 풀었고, 미해결 오답 0
  var done = (totalN>0 && seenSyn>=totalN && unsolved===0);
  return {seen:seenSyn, total:totalN, acc:acc, unsolved:unsolved, done:done};
}
function unitLabel(d){
  // 드롭다운/진도 표시용 라벨 (완료✅ · 정답률)
  var u=unitStats(d.key, d.n);
  var base=d.label+' ('+d.n+')';
  if(u.seen===0) return base;  // 아직 안 푼 강
  var badge = u.done ? ' ✅' : ' ·'+Math.round(u.seen/u.total*100)+'%';
  var accS = (u.acc!==null) ? ' 정답'+u.acc+'%' : '';
  return base + badge + accS;
}

// ── 손으로 쓸 단어 선별 ──
function penPick(limit, unitKey){
  limit=limit||20;
  // ① 많이 틀린 단어 (그 강 기준, 무조건 limit개까지)
  var vol=null, day=null;
  if(unitKey){ var m=String(unitKey).match(/^v(\d)d(\d+)$/); if(m){ vol=parseInt(m[1]); day=parseInt(m[2]); } }
  var hard=[];
  for(var k in STATS){
    var r=STATS[k];
    if(!(r.wrong>0)) continue;
    if(vol!==null && (r.vol!==vol || r.day!==day)) continue;
    hard.push(r);
  }
  // 이번 사이클에서 틀린 횟수 기준 (없으면 누적으로 대체)
  hard.sort(function(a,b){
    var ca=(a.cyc!==undefined?a.cyc:a.wrong)||0, cb=(b.cyc!==undefined?b.cyc:b.wrong)||0;
    return cb-ca || (a.right||0)-(b.right||0);
  });
  hard = hard.filter(function(r){ return ((r.cyc!==undefined?r.cyc:r.wrong)||0)>0; });
  if(PEN_RANDOM){
    // 전체 범위: 많이 틀린 상위권에서 랜덤으로 (매번 다른 조합)
    var pool = hard.slice(0, Math.max(limit*3, 60));
    hard = shuf(pool).slice(0, limit);
  } else {
    hard = hard.slice(0, limit);
  }
  // 이 목록에 든 횟수를 누적 (진짜 약점 찾기용)
  if(unitKey){
    for(var h=0;h<hard.length;h++){
      var rr=STATS[hard[h].w];
      if(rr){ rr.picked=(rr.picked||0)+1; rr.pickedAt=Date.now(); }
    }
    statsSave();
  }
  var inHard={};
  for(var i=0;i<hard.length;i++) inHard[hard[i].w]=1;
  // ② 내가 담은 단어 (위와 겹치는 건 제외)
  var mine=[];
  var pl=penList();
  for(var j=0;j<pl.length;j++){ if(!inHard[pl[j].w]) mine.push(pl[j]); }
  return {hard:hard, mine:mine};
}

var PEN_RANDOM=false;   // 전체 범위에서 랜덤으로 뽑기

      +'<div class="pbody">'
      +'<div class="pw">'+esc(w.w)+ (!mine && w.wrong ? '<span class="pcnt">'+w.wrong+'회 틀림</span>' : '') +'</div>'

      : PEN_RANDOM
        ? '전체 범위에서 많이 틀린 단어를 무작위로 뽑았어요 — 다시 뽑기로 새 조합을 볼 수 있어요'
        : '종이나 굿노트에 옮겨 적으며 정리해 보세요';

var CAL_Y=null, CAL_M=null;
function calDraw(){
  var now=new Date();
  if(CAL_Y===null){ CAL_Y=now.getFullYear(); CAL_M=now.getMonth(); }
  var first=new Date(CAL_Y, CAL_M, 1);
  var last=new Date(CAL_Y, CAL_M+1, 0);
  $('caltitle').textContent=CAL_Y+'년 '+(CAL_M+1)+'월';
  var h='<div class="calrow head">';
  ['일','월','화','수','목','금','토'].forEach(function(w,i){
    h+='<div class="calh'+(i===0?' sun':(i===6?' sat':''))+'">'+w+'</div>';
  });
  h+='</div><div class="calrow">';
  for(var b=0;b<first.getDay();b++) h+='<div class="calc empty"></div>';
  var todayK=dayKey(), mSyn=0, mCopy=0, mDone=0;
  for(var day=1;day<=last.getDate();day++){
    var k=CAL_Y+'-'+('0'+(CAL_M+1)).slice(-2)+'-'+('0'+day).slice(-2);
    var d=DAILY[k];
    var cls='calc', mark='';
    if(d){
      mSyn+=d.syn; mCopy+=d.copy;
      if(d.syn>=DAILY_GOAL){ cls+=' done'; mark='✓'; mDone++; }
      else if(d.syn>=DAILY_GOAL/2){ cls+=' half'; mark='◐'; }
      else if(d.syn>0){ cls+=' some'; mark='·'; }
      if(d.copy>0) cls+=' hascopy';
    }
    if(k===todayK) cls+=' today';
    if(diaryHas(k)) cls+=' hasnote';
    // 그날 끝낸 강 번호를 작게 (예: 5·6·7강)
    var ustr='';
    if(d && d.units && d.units.length){
      var ns=[];
      for(var uu=0; uu<d.units.length; uu++){
        var mm=String(d.units[uu]).match(/^v(\d)d(\d+)$/);
        if(mm) ns.push(parseInt(mm[2]));
        else ns.push(String(d.units[uu]).replace('mvp','M'));
      }
      ns.sort(function(a,b){ return a-b; });
      ustr='<span class="cu">'+ns.join('·')+'강</span>';
    }
    h+='<div class="'+cls+'" data-day="'+k+'"><span class="cd">'+day+'</span>'
      +(mark?'<span class="cm">'+mark+'</span>':'')
      +(d&&d.syn?'<span class="cn">'+d.syn+'</span>':'')
      +ustr+'</div>';
    if((first.getDay()+day)%7===0 && day<last.getDate()) h+='</div><div class="calrow">';
  }
  h+='</div>';
  $('calgrid').innerHTML=h;
  // 연속 달성일
  var streak=0, cur=new Date();
  for(;;){
    var kk=dayKey(cur), dd=DAILY[kk];
    if(dd && dd.syn>=DAILY_GOAL) streak++;
    else if(kk!==todayK) break;      // 오늘은 아직 못 채웠어도 이어서 계산
    else { }
    cur.setDate(cur.getDate()-1);
    if(streak>400) break;
  }
  $('calsum').innerHTML='이번 달 <b>'+mDone+'</b>일 달성  ·  동의어 매칭 <b>'+mSyn+'</b>개'
    + (mCopy?'  ·  따라쓰기 <b>'+mCopy+'</b>개':'')
    + (streak>1?'<div class="streak">🔥 연속 '+streak+'일 달성 중</div>':'');
  $('calcnt').textContent='목표 '+DAILY_GOAL+'개/일';
  var dp=$('dayPanel'); if(dp && !DAY_KEY) dp.style.display='none';
}

var APP_VER = '2026.09.03';  // 이 파일의 버전. ver.json과 비교해 새 버전 감지
var VER = APP_VER;  // 데이터 URL 캐시 키. 배포 때만 바뀌므로 브라우저 캐시가 제대로 재사용됨
function loadJ(p){
  // 데이터 파일은 URL에 버전(v=)이 붙어 캐시가 자동 갱신되므로 브라우저 캐시를 허용한다.
  // (no-store로 하면 강 파일 90여 개를 매번 네트워크에서 새로 받아 매우 느려짐)
  var url = p + (p.indexOf('?')<0 ? '?' : '&') + 'v=' + VER;
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error(p+' (HTTP '+r.status+')');
    return r.json();
  });
}
function getDay(k){
  if(CACHE[k]) return Promise.resolve(CACHE[k]);
  return loadJ('data/'+k+'.json').then(function(it){
    if(!Array.isArray(it)||!it.length) throw new Error(k+'.json이 비었습니다');
    for(var i=0;i<it.length;i++){
      if(!it[i].w||!it[i].m) throw new Error(k+'.json: 항목 '+(i+1)+' 손상');
    }
    CACHE[k]=it;
    return it;
  });
}

function checkVersion(){
  // 매번 유니크한 타임스탬프로 요청 → 사파리가 어떤 경우에도 캐시 못 씀
  return fetch('data/ver.json?t='+Date.now(), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('ver');
    return r.json();
  }).then(function(d){
    if(d && d.v && d.v !== APP_VER){
      // 현재 URL에 이미 이 버전 쿼리가 붙어 있으면 재시도 안 함(무한 방지)
      var cur = new URLSearchParams(location.search).get('app');
      if(cur !== d.v){
        var u = location.pathname + '?app=' + encodeURIComponent(d.v);
        location.replace(u);  // 새 주소 → 사파리가 최신 HTML을 가져옴
        return false;
      }
    }
    return true;
  }).catch(function(){ return true; });  // ver.json 없어도 앱은 정상 동작
}

    });

  });

// 오답 풀(POOL)을 전체 단어로 채움. 정답 대상 리스트는 별도로 유지
function buildFullPool(){
  return fetchAllItems().then(function(all){
    POOL={
      words: all.filter(function(x){return x.type==='word';}),
      phrases: all.filter(function(x){return x.type==='phrase';}),
      all: all.slice()
    };
    return all;
  });
}

function start(){
  __lastAction='시작클릭(mode='+st.mode+',target='+st.target+',n='+st.n+',cum='+st.cum+')';
  SRC='normal';
  if(!IDX){ msg('❌ 데이터가 아직 준비되지 않았습니다. 새로고침 해주세요.','err'); return; }

  msg('불러오는 중…','load');
  // 15초 넘게 걸리면 안내 (멈춘 것처럼 보이는 문제 방지)
  var slowTimer=setTimeout(function(){
    msg('불러오는 중… 범위가 넓어 시간이 걸립니다. 잠시만요','load');
  },15000);
  fetchItems().then(function(items){
    clearTimeout(slowTimer);
    var words=filterTarget(items);
    // 오답 풀: 단어 오답은 단어끼리, 표현 오답은 표현끼리 뽑도록 분리 저장
    POOL = {
      words: items.filter(function(x){return x.type==='word';}),

      all: items.slice()
    };

    $('go').disabled=false;

    if(st.mode==='card'){
      if(!words.length) throw new Error('단어가 없습니다');
      SET=words.slice(st.set*25,(st.set+1)*25);

      CI=0;
      show('cardscr');
      drawCard();
      return;
    }

    if(st.mode==='browse'){
      var bw=words.filter(function(x){return x.s&&x.s.length;});
      if(!bw.length) throw new Error('동의어가 있는 단어가 없습니다');
      drawBrowse(bw);
      show('browsescr');
      return;
    }

    if(st.mode==='roots'){

      show('rootscr');
      return;
    }

    if(st.mode==='write'){
      var ww=words.filter(function(x){return x.s&&x.s.length;});
      if(ww.length<1) throw new Error('동의어가 있는 항목이 없습니다');
      var wn=st.n===0?ww.length:Math.min(st.n,ww.length);
      startWrite(shuf(ww).slice(0,wn));
      return;
    }

    if(st.mode==='copy'){
      // 따라쓰기는 오답 선지가 필요 없으므로 전체 풀을 받지 않는다 (로딩 대기 제거)
      var cw=words;
      if(cw.length<1) throw new Error('항목이 없습니다');
      var cn=st.n===0?cw.length:Math.min(st.n,cw.length);
      try{
        startCopy(shuf(cw).slice(0,cn));
        try{ ghRefill(); }catch(e){}
        // 동의어 어원 색인은 백그라운드에서 준비 (화면은 즉시 표시)
        setTimeout(function(){
          fetchAllItems().then(function(){ _rootByWord=null; renderFocus(CQ[cqi]); }).catch(function(){});
        }, 50);
      }catch(err){
        msg('❌ 따라쓰기 오류: '+err.message,'err');
        show('setup');
      }
      return;
    }

    var target=words;
    if(target.length<1) throw new Error('항목이 없습니다');
    var n=st.n===0?target.length:Math.min(st.n,target.length);
    var picked=shuf(target).slice(0,n);
    if(st.mode==='syn') cycleReset(picked);   // 새 사이클 시작
    // 오답 선지 풀을 전체 단어로 확장 (매번 다양한 보기 + 보기 부족 방지)
    buildFullPool().then(function(){
      launch(picked);
    }).catch(function(){ launch(picked); });
  }).catch(function(e){
    clearTimeout(slowTimer);
    $('go').disabled=false;
    msg('❌ '+e.message,'err');
  });
}

function drawBrowse(list){
  var box=$('brlist'); box.innerHTML='';
  $('brcnt').textContent=list.length+'개 단어';
  list.forEach(function(w){
    var d=document.createElement('div');
    d.className='bw';
    var groups='';
    var pairs=(w.p&&w.p.length)?w.p:[{d:w.m,s:w.s||[]}];
    pairs.forEach(function(p){
      if(!p.s||!p.s.length) return;
      groups+='<div class="bgroup"><div class="bd">'+esc(p.d)+'</div>'
            + '<div class="bs">'+p.s.map(esc).join(' · ')+'</div></div>';
    });
    var h='<div class="h"><span class="bword">'+esc(w.w)+'</span>'

var _repIndex=null;
function buildRepIndex(){
  _repIndex={};
  if(!ROOTS) return;
  ROOTS.forEach(function(g){
    if(g.rep && g.rep.length){
      _repIndex[g.root.toLowerCase()+'|'+g.gloss]=g.rep;
    }
  });
}
function repWordsFor(r){
  if(!r || r.charAt(0)==='[') return [];
  if(!_repIndex) buildRepIndex();
  var head=r.split('\u2192')[0];  // → 앞부분
  var parts=head.split('+');
  var out=[], seen={};
  for(var i=0;i<parts.length;i++){
    var m=parts[i].replace(/^\s+/,'').match(/^-?([a-zA-Z]+)\(([^)]+)\)/);
    if(m){
      var key=m[1].toLowerCase()+'|'+m[2];
      if(_repIndex[key]){
        _repIndex[key].forEach(function(w){ if(!seen[w]){ seen[w]=1; out.push(w); } });
      }
    }
  }
  return out;
}

var WQ=[], wqi=0, wgot=[], wdone=false;
// 예문에서 구문이 나타난 위치 찾기 (빈칸 처리용). 불규칙/시제 변형까지 대응
var _IRR={be:['was','were','been','is','are','am'],become:['became'],blow:['blew','blown'],
 "break":['broke','broken'],bring:['brought'],build:['built'],buy:['bought'],"catch":['caught'],
 come:['came'],cut:['cut'],"do":['did','done','does'],draw:['drew','drawn'],drive:['drove','driven'],
 fall:['fell','fallen'],feel:['felt'],find:['found'],get:['got','gotten'],give:['gave','given'],
 go:['went','gone','goes'],grow:['grew','grown'],hang:['hung'],have:['had','has'],hold:['held'],
 keep:['kept'],lay:['laid'],lead:['led'],leave:['left'],let:['let'],lie:['lay','lain'],
 lose:['lost'],make:['made'],meet:['met'],pay:['paid'],put:['put'],read:['read'],
 run:['ran'],say:['said'],see:['saw','seen'],sell:['sold'],send:['sent'],set:['set'],
 shut:['shut'],sit:['sat'],sleep:['slept'],speak:['spoke','spoken'],spend:['spent'],
 stand:['stood'],take:['took','taken'],teach:['taught'],tear:['tore','torn'],tell:['told'],
 think:['thought'],throw:['threw','thrown'],wear:['wore','worn'],win:['won'],write:['wrote','written'],
 stick:['stuck'],strike:['struck'],wake:['woke','woken'],sing:['sang','sung'],ring:['rang','rung'],
 drink:['drank','drunk'],begin:['began','begun'],swim:['swam','swum'],hit:['hit'],hurt:['hurt'],
 cost:['cost'],shoot:['shot'],freeze:['froze','frozen'],choose:['chose','chosen'],rise:['rose','risen'],
 dig:['dug'],hide:['hid','hidden'],sink:['sank','sunk'],bear:['bore','borne'],beat:['beat','beaten']};
function _resc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
var _PRON={
  "oneself":['oneself','myself','yourself','himself','herself','itself','ourselves','themselves'],
  "one's":["one's","my","your","his","her","its","our","their"],
  "sb":['him','her','them','me','you','us','somebody','someone'],
  "somebody":['him','her','them','me','you','us','somebody','someone'],
  "someone":['him','her','them','me','you','us','somebody','someone'],
  "sth":['it','something','them'],
  "something":['it','something','them']
};
function _vars(w){
  if(_PRON[w]) return _PRON[w].slice();      // 대명사·자리표시자는 대체어 목록으로
  var o={}; o[w]=1;
  if(_IRR[w]) for(var i=0;i<_IRR[w].length;i++) o[_IRR[w][i]]=1;
  o[w+'s']=1; o[w+'ed']=1; o[w+'ing']=1;
  if(w.charAt(w.length-1)==='e'){ o[w+'d']=1; o[w.slice(0,-1)+'ing']=1; }
  if(w.charAt(w.length-1)==='y'){ o[w.slice(0,-1)+'ies']=1; o[w.slice(0,-1)+'ied']=1; }
  var a=[]; for(var k in o) a.push(k);
  a.sort(function(x,y){ return y.length-x.length; });
  return a;
}
function phraseSpan(phrase, sent){
  if(!phrase||!sent) return null;
  var p=phrase.trim(), low=sent.toLowerCase(), pl=p.toLowerCase();
  var i=low.indexOf(pl);
  if(i>=0) return [i, i+p.length];
  var pl2=pl.replace(/\b(one's|sb|sth|someone's|somebody's)\b/g,'').replace(/[~]/g,'').replace(/\s+/g,' ').trim();
  if(pl2 && pl2!==pl){ i=low.indexOf(pl2); if(i>=0) return [i, i+pl2.length]; }
  var raw=pl.split(/\s+/), words=[];
  for(var a=0;a<raw.length;a++){
    var w=raw[a];
    if(!w || w==="~") continue;
    // 'do'(동사 자리), 관사 등은 어떤 단어로도 바뀔 수 있으므로 와일드카드 처리
    if(a>0 && (w==='do'||w==='sth'||w==='sb')) { words.push('*'); continue; }
    words.push(w);
  }
  // '=' 로 대체 표기된 구문은 앞쪽만 사용 (예: 'awash in = awash with')
  var eq=words.indexOf('=');
  if(eq>0) words=words.slice(0,eq);
  // 맨 앞 'be'는 예문에서 축약(I'm/he's)되거나 형태가 바뀌므로, 없이도 매칭되게 준비
  var beLead = (words.length>1 && words[0]==='be');
  if(!words.length) return null;
  try{
    var parts=[];
    for(var b=0;b<words.length;b++){
      if(words[b]==='*'){ parts.push('\\w+'); continue; }   // 어떤 단어든 허용
      var vs=_vars(words[b]), esc=[];
      for(var c=0;c<vs.length;c++) esc.push(_resc(vs[c]));
      parts.push('(?:'+esc.join('|')+')');
    }
    var m=low.match(new RegExp('\\b'+parts.join('(?:\\s+\\w+){0,3}\\s+')+'\\b'));
    if(m) return [m.index, m.index+m[0].length];
    // 맨 앞 be를 뺀 형태로 재시도 (I'm fed up with ... 처럼 축약된 경우)
    if(beLead && parts.length>1){
      var m1=low.match(new RegExp('\\b'+parts.slice(1).join('(?:\\s+\\w+){0,3}\\s+')+'\\b'));
      if(m1) return [m1.index, m1.index+m1[0].length];
    }
    var p2=[];
    for(var d=0;d<words.length;d++){
      if(words[d]==='*'){ p2.push('\\w+'); continue; }
      var st=words[d].slice(0, Math.max(3, words[d].length-2));
      p2.push(_resc(st)+'\\w*');
    }
    var m2=low.match(new RegExp('\\b'+p2.join('(?:\\s+\\w+){0,2}\\s+')));
    if(m2) return [m2.index, m2.index+m2[0].length];
  }catch(e){}
  return null;
}

var SIMILAR=null;
function similarLoad(){
  loadJ('data/similar.json').then(function(d){ SIMILAR=d||{}; }).catch(function(){ SIMILAR={}; });

function similarOf(word){
  if(!SIMILAR) return [];
  var list=SIMILAR[word]||[];
  if(!list.length) return [];
  var pool=_allPool||(POOL&&POOL.all)||[];
  var byW={};
  for(var i=0;i<pool.length;i++) byW[pool[i].w]=pool[i];
  var cur=null;
  for(var j=0;j<pool.length;j++){ if(pool[j].w===word){ cur=pool[j]; break; } }
  var out=[];
  for(var k=0;k<list.length;k++){
    var it=byW[list[k]];
    if(!it) continue;
    out.push({w:it.w, m:it.m, vol:it.vol, day:it.day,
      same: !!(cur && it.vol===cur.vol && it.day===cur.day)});
  }
  out.sort(function(a,b){ return (b.same?1:0)-(a.same?1:0); });
  return out;
}

// 이 동의어가 메인 단어의 '어느 뜻 갈래'에 해당하는지
// (갈래가 하나뿐이면 위에 표시된 뜻과 같으므로 표시하지 않음)
// 동의어 단어 자체의 뜻 (다른 항목으로 실려 있으면 그걸 씀)
function synOwnMean(syn){
  var pool=_allPool||(POOL&&POOL.all)||[];
  var key=String(syn).toLowerCase().trim();
  for(var i=0;i<pool.length;i++){
    if(String(pool[i].w).toLowerCase().trim()===key) return String(pool[i].m||'').trim();
  }
  return '';
}
function synSense(w, syn){
  var ps=w.p||[];
  var key=String(syn).toLowerCase().trim();
  // ① 갈래가 전체 뜻의 일부만 가리키면 그 갈래를 보여준다
  //    (예: decorate = 장식하다 / 훈장을 수여하다 → 동의어는 '장식하다'에만 해당)
  var useGal = !(ps.length===1 &&
      (!String(ps[0].d||'').trim() || String(ps[0].d||'').trim()===String(w.m||'').trim()));
  if(useGal){
    for(var i=0;i<ps.length;i++){
      var arr=ps[i].s||[];
      for(var j=0;j<arr.length;j++){
        if(String(arr[j]).toLowerCase().trim()===key){
          var d=String(ps[i].d||'').trim();
          if(d.length>26) d=d.slice(0,25)+'…';
          return d;
        }
      }
    }
  }
  // ② 갈래로 보여줄 게 없으면 동의어 자체의 뜻을 보여준다
  var om=synOwnMean(syn);
  if(om){
    if(om.length>26) om=om.slice(0,25)+'…';
    return om;
  }
  return '';
}

function copySubmit(){
  var w=CQ[cqi];
  if(cWaiting){          // 다 채운 뒤 Enter 한 번 더 → 다음 항목으로
    cWaiting=false;
    copyNext(true);
    return;
  }
  var v=$('cinput').value.trim();
  if(!v) return;  // 빈칸이면 안 넘어감 (최소한 손은 움직이게)
  var nv=normSyn(v);

  // 빈칸 모드: 빈칸에 답을 채워 보여주고 다음으로
  if(w._cmode==='blank' && cGot.indexOf(0)<0){
    // ① 먼저 빈칸 채우기
    var ans=w._call[0], an=normSyn(ans);
    var ok0 = (an===nv) || (nv.length>=3 && an.indexOf(nv.slice(0,3))===0) || nv.length>=an.length*0.6;
    var slot=$('cblank');
    if(slot){
      slot.textContent=ans;
      slot.className='blankslot filled'+(ok0?'':' miss');
    }
    cGot.push(0);
    var chip0=$('canswers').querySelector('[data-i="0"]');

    $('cinput').value='';
    if(cGot.length>=w._call.length){        // 동의어가 없으면 여기서 끝
      var inp0=$('cinput');
      if(inp0){ inp0.classList.add('donef'); setTimeout(function(){ inp0.classList.remove('donef'); },900); }
      copyCelebrate();
      $('cfb').textContent=(ok0?'✓':'정답: '+ans)+'   —   Enter로 다음';
      $('cfb').style.color=ok0?'#4ecca3':'#f0a500';
      cWaiting=true;
      return;
    }
    // 동의어가 남아 있으면 다음 칩을 현재로
    $('cfb').textContent = ok0 ? '✓  이어서 동의어' : '↷ 정답: '+ans+'  —  이어서 동의어';
    $('cfb').style.color = ok0 ? '#4ecca3' : '#f0a500';
    renderFocus(w);
    $('cinput').focus();
    return;
  }

  // 현재 채워야 할 칩(첫 미완료) 찾기
  var cur=-1;
  for(var i=0;i<w._call.length;i++){ if(cGot.indexOf(i)<0){ cur=i; break; } }
  if(cur<0){ copyNext(true); return; }

  var target=w._cnorm[cur];
  var ok;
  if(w._cmode==='sentence' && cur===1){
    ok = nv.length >= target.length*0.5;   // 예문은 절반 이상 치면 인정
  } else {
    ok = (target===nv) || (nv.length>=3 && target.indexOf(nv.slice(0,3))===0);
  }

  // 맞든 틀리든 진행 (가벼운 모드) — 맞으면 초록, 아니면 회색 처리
  cGot.push(cur);

  if(el){ el.className='cans '+(ok?'done':'skip')+(w._cmode==='sentence'&&cur===1?' sent':''); }
  $('cfb').textContent = ok ? '✓' : '↷ 지나감';
  $('cfb').style.color = ok ? '#4ecca3' : '#8899bb';
  $('cinput').value='';

  // 다 채웠으면 다음 단어
  if(cGot.length>=w._call.length){
    var inp2=$('cinput');
    if(inp2){ inp2.classList.add('donef'); setTimeout(function(){ inp2.classList.remove('donef'); },900); }
    copyCelebrate();          // 목록 전체 민트로 + 상단 완료 배지
    var allOk=true;
    var chips=$('canswers').querySelectorAll('.cans');
    for(var ci=0;ci<chips.length;ci++){ if(chips[ci].classList.contains('skip')) allOk=false; }
    $('cfb').textContent=(allOk?'✓ 완료':'↷ 완료')+'   —   Enter로 다음';
    $('cfb').style.color=allOk?'#4ecca3':'#8899bb';

  // 다음 칩 표시 + 안내문구 갱신

  for(var k=0;k<els.length;k++){ els[k].classList.remove('cur'); }
  var nextIdx=-1;
  for(var k2=0;k2<els.length;k2++){
    if(!els[k2].classList.contains('done')){ els[k2].classList.add('cur'); nextIdx=k2; break; }
  }
  renderFocus(w);
  if(nextIdx===1){
    $('cask').textContent = (w._cmode==='sentence') ? '예문을 따라 입력하고 Enter'
                          : (w._cmode==='meaning' ? '뜻을 따라 입력하고 Enter' : '동의어를 따라 입력하고 Enter');
  } else if(nextIdx>1){
    $('cask').textContent='동의어를 따라 입력하고 Enter';
  }
  $('cinput').focus();
}

function writeSubmit(){

// 강을 새로 시작하면 그 강 단어들의 사이클 카운터를 초기화
function cycleReset(list){
  for(var i=0;i<list.length;i++){
    var r=STATS[list[i].w];
    if(r) r.cyc=0;
  }
  statsSave();
}
function launch(list, opts){
  if(opts && opts.rev){
    // 역방향 확인: 동의어 → 원래 단어
    var pool = POOL.all && POOL.all.length ? POOL.all : list;
    Q = [];
    for(var i=0;i<list.length;i++){
      var q = buildRev(list[i], pool);
      if(q) Q.push(q);
    }
    if(!Q.length){ msg('역방향으로 낼 수 있는 문제가 없습니다','err'); show('setup'); return; }
    qi=0; ans=new Array(Q.length).fill(null); wrongs=[]; fin=false; MOPUP=false;
    hide(); show('qscr'); draw(); sessionSave();
    return;
  }
  if(st.mode==='syn'){
    // 동의어 있으면 동의어 매칭, 없으면 뜻 맞추기로 섞어서 출제
    Q = list.map(function(w){
      var hasSyn = (w.p && w.p.some(function(pr){return pr.s&&pr.s.length;})) || (w.s&&w.s.length);
      return hasSyn ? buildSyn(w) : buildQuiz(w);
    });
  } else {
    Q = list.map(buildQuiz);
  }
  qi=0; ans=new Array(Q.length).fill(null); wrongs=[]; fin=false; MOPUP=false;
  hide();
  show('qscr');
  draw();
  sessionSave();
}

// ---------- 진행 중인 퀴즈 저장/복구 (앱 나갔다 와도 이어 풀기) ----------
var SESKEY='voca_session_v2';
var SESMAP='voca_sessions_v1';      // 강별 세션 보관 (기기 간 동기화 대상)
var SESSIONS={};
function sessionsLoad(){ try{ var r=localStorage.getItem(SESMAP); if(r) SESSIONS=JSON.parse(r)||{}; }catch(e){ SESSIONS={}; } }
function sessionsSave(){ try{ localStorage.setItem(SESMAP, JSON.stringify(SESSIONS)); }catch(e){} }
function sesKeyOf(d){ return (d.mode||'syn')+'|'+(d.key||'')+'|'+(d.cum?'c':'s'); }
// 안 푼 문제가 남은 세션들만 (최근 순)
function sessionsList(){
  var o=[];
  for(var k in SESSIONS){
    var d=SESSIONS[k];
    if(!d||!d.Q||!d.Q.length) continue;
    var undone=(d.ans||[]).some(function(a){return a===null;});
    if(undone) o.push(d);
  }
  o.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  return o;
}
function sessionSave(){
  if(fin || !Q.length){ sessionClear(); return; }
  try{
    // Q의 각 문제를 재구성 가능한 형태로 직렬화
    var qd = Q.map(function(q){
      return {
        wid: q.w.id, wkey: q.w.w,
        opts: q.opts.map(function(o){
          return {t:o.t, ok:o.ok, sense:o.sense||'', def:o.def||'', srcw:o.srcw||''};
        }),
        ans: (q.ans!==undefined?q.ans:null),
        need: (q.need!==undefined?q.need:null),
        isPhrase: (q.isPhrase!==undefined?q.isPhrase:null),
        kind: q.kind
      };
    });
    var data={ mode:st.mode, key:st.key, cum:st.cum, src:SRC, qi:qi, ans:ans, wrongs:wrongs, Q:qd, ts:Date.now() };
    localStorage.setItem(SESKEY, JSON.stringify(data));
    SESSIONS[sesKeyOf(data)]=data;      // 강별로도 보관 (기기 간 동기화)
    sessionsSave();
    if(typeof syncSoon==='function') syncSoon();
  }catch(e){}
}
function sessionClear(){
  try{ localStorage.removeItem(SESKEY); }catch(e){}
  try{
    var k=(st.mode||'syn')+'|'+(st.key||'')+'|'+(st.cum?'c':'s');
    if(SESSIONS[k]){ delete SESSIONS[k]; sessionsSave(); if(typeof syncSoon==='function') syncSoon(); }
  }catch(e){}
}
function sessionHas(){
  var list=sessionsList();
  if(list.length) return list[0];       // 가장 최근 세션
  try{
    var raw=localStorage.getItem(SESKEY);
    if(!raw) return null;
    var d=JSON.parse(raw);
    if(!d||!d.Q||!d.Q.length) return null;
    var undone=d.ans.some(function(a){return a===null;});
    if(!undone) return null;
    return d;
  }catch(e){ return null; }
}
function sessionResume(sesKey){
  var d = sesKey ? SESSIONS[sesKey] : sessionHas();
  if(!d) return false;
  MOPUP=false;
  st.mode=d.mode; st.key=d.key; st.cum=d.cum; SRC=d.src||'normal';
  // 저장된 진도의 단어 데이터를 먼저 확보 (해설용 뜻/어원)
  Promise.all(keys().map(getDay)).then(function(){
    Q = d.Q.map(function(qd){
      var w = findWordById(qd.wid, qd.wkey);
      var q = { w:w, opts:qd.opts, kind:qd.kind };
      if(qd.ans!==null && qd.ans!==undefined) q.ans=qd.ans;
      if(qd.need!==null && qd.need!==undefined) q.need=qd.need;
      if(qd.isPhrase!==null && qd.isPhrase!==undefined) q.isPhrase=qd.isPhrase;
      return q;
    });
    qi=d.qi; ans=d.ans; wrongs=d.wrongs||[]; fin=false;
    hide();
    show('qscr');
    draw();
  }).catch(function(){
    // 로드 실패해도 저장된 opts로 최소 진행
    Q = d.Q.map(function(qd){
      return { w:findWordById(qd.wid, qd.wkey), opts:qd.opts, kind:qd.kind,
               ans:(qd.ans!==null&&qd.ans!==undefined?qd.ans:undefined),
               need:(qd.need!==null&&qd.need!==undefined?qd.need:undefined),
               isPhrase:(qd.isPhrase!==null&&qd.isPhrase!==undefined?qd.isPhrase:undefined) };
    });
    qi=d.qi; ans=d.ans; wrongs=d.wrongs||[]; fin=false;
    hide(); show('qscr'); draw();
  });
  return true;
}
// 단어를 id로 찾기 (현재 로드된 CACHE 우선, 없으면 전 범위 탐색은 생략)
function findWordById(id, wkey){
  for(var k in CACHE){
    var arr=CACHE[k];
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===id && arr[i].w===wkey) return arr[i];
    }
  }
  // fallback: 최소 정보로 구성
  return {id:id, w:wkey, m:'', s:[], p:[], r:''};
}

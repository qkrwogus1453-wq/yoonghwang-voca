// ---- 동의어 매칭: 정답 동의어 + 오답(다른 단어의 동의어) ----
// 역방향: 동의어를 보여주고 원래 단어를 맞히기
function buildRev(w, pool){
  var syns = (w.s||[]).slice();
  if(!syns.length) return null;
  // 문제로 보여줄 동의어 1~2개
  var shown = shuf(syns).slice(0, Math.min(2, syns.length));
  // 정답 = 메인 단어, 오답 = 뜻이 겹치지 않는 다른 단어들
  var opts = [{t:w.w, ok:true, srcw:w.w}];
  var cand = shuf(pool), seen={}; seen[String(w.w).toLowerCase().trim()]=1;
  // 이 단어의 동의어들도 오답에서 제외 (답이 둘이 되지 않게)
  syns.forEach(function(s){ seen[String(s).toLowerCase().trim()]=1; });
  for(var i=0;i<cand.length && opts.length<6;i++){
    var c=cand[i];
    var k=String(c.w).toLowerCase().trim();
    if(seen[k]) continue;
    if(shareMeaning(w.m, c.m)) continue;          // 뜻 겹치면 제외
    // 그 후보의 동의어에 이 단어가 있으면 제외
    var bad=false;
    (c.s||[]).forEach(function(s){ if(String(s).toLowerCase().trim()===String(w.w).toLowerCase().trim()) bad=true; });
    if(bad) continue;
    seen[k]=1;
    opts.push({t:c.w, ok:false, srcw:c.w});
  }
  if(opts.length<4) return null;
  return {
    w: w, kind:'rev', need:1,
    prompt: shown.join(',  '),
    opts: shuf(opts)
  };
}
function buildSyn(w){
  var pairs = (w.p && w.p.length) ? w.p : [{d:w.m, s:w.s||[]}];

  // 동의어 -> 그 동의어가 속한 뜻 매핑
  var senseOf = {};
  var all = [];
  pairs.forEach(function(pr){
    (pr.s||[]).forEach(function(t){
      var k = t.toLowerCase().trim();
      if(!k || senseOf[k]) return;
      senseOf[k] = pr.d;
      all.push(t);
    });
  });
  if(!all.length) all = (w.s||[]).slice();

  // ── 동의어 노출 확대 ──
  // 같은 단어를 다시 만날수록 정답(동의어)을 더 많이 보여준다.
  // 선지는 최대 9개, 오답은 최소 3개 → 정답은 최대 6개.
  // 화면이 좁으면(휴대폰) 선지를 7개까지만 — 스크롤 없이 한눈에 들어오게
  var MAXOPT = (typeof window!=='undefined' && window.innerWidth < 700) ? 7 : 9;
  var MINWRONG=3;
  var rec = STATS[w.w];
  var prevShown = (rec && rec.shown) || 0;      // 지난번에 보여준 정답 수
  var want;
  if(!prevShown) want = Math.min(3, all.length);          // 처음엔 3개(또는 있는 만큼)
  else want = Math.min(prevShown + 2, all.length);         // 다시 만나면 +2
  want = Math.min(want, MAXOPT - MINWRONG);                // 정답 상한 6개
  var right = shuf(all).slice(0, want);
  // 다음번을 위해 이번에 보여준 개수 기록
  if(rec){ rec.shown = right.length; }

  var seen={};
  seen[w.w.toLowerCase()]=1;
  all.forEach(function(t){ seen[t.toLowerCase()]=1; });   // 안 뽑힌 동의어도 오답 금지

  // 오답: 최소 3개 + 랜덤 (선지 총합 6~9개) → 선지 수로 정답 수를 예측할 수 없게
  var MINOPT=6;
  var lo = Math.max(MINWRONG, MINOPT - right.length);   // 선지 6개는 보장
  var hi = MAXOPT - right.length;                        // 최대 9개까지
  if(hi<lo) hi=lo;
  var need = lo + Math.floor(Math.random()*(hi-lo+1));
  // 정답이 표현이면 오답도 표현에서, 단어면 단어에서
  var srcPool = (w.type==='phrase') ? POOL.phrases : POOL.words;
  if(srcPool.length<2) srcPool = POOL.all;  // 극단적 부족시만 fallback
  var wrong=[], cand=shuf(srcPool);
  // 1차: 뜻을 아는 단어만 오답으로 (defOf가 있는 것)
  for(var i=0;i<cand.length && wrong.length<need;i++){
    var c=cand[i];
    if(c.w===w.w) continue;
    var src = (c.s&&c.s.length) ? c.s : [c.w];
    // 이 단어의 동의어 중 뜻이 있는 것 우선
    var withDef = src.filter(function(t){ return defOf(t); });
    var pool2 = withDef.length ? withDef : [];
    if(!pool2.length) continue;
    var pick = pool2[Math.floor(Math.random()*pool2.length)];
    if(!pick||seen[pick.toLowerCase()]) continue;
    seen[pick.toLowerCase()]=1;
    wrong.push(pick);
  }
  // 2차: 부족하면 뜻 없는 것도 허용
  for(var i2=0;i2<cand.length && wrong.length<need;i2++){
    var c2=cand[i2];
    if(c2.w===w.w) continue;
    var src2 = (c2.s&&c2.s.length) ? c2.s : [c2.w];
    var pick2=src2[Math.floor(Math.random()*src2.length)];
    if(!pick2||seen[pick2.toLowerCase()]) continue;
    seen[pick2.toLowerCase()]=1;
    wrong.push(pick2);
  }
  var opts=shuf(right.concat(wrong)).map(function(t){
    var ok = right.indexOf(t)>=0;
    return {
      t: t,
      ok: ok,
      sense: ok ? (senseOf[t.toLowerCase().trim()] || '') : '',   // 정답: 메인 단어의 어느 뜻
      def:  ok ? '' : defOf(t)                                      // 오답: 그 단어 자체의 뜻
    };
  });
  return {w:w, opts:opts, need:right.length, kind:'syn'};
}

function buildQuiz(w){
  // 정답이 표현이면 오답도 반드시 표현끼리, 단어면 반드시 단어끼리
  var isPhrase = (w.type==='phrase');
  var basePool = isPhrase ? POOL.phrases : POOL.words;
  if(basePool.length<2) basePool = POOL.all;  // 극단적으로 1개뿐이면 어쩔 수 없이 전체
  var seen={}; seen[w.m]=1;
  var d=[], cand=shuf(basePool);

  if(isPhrase){
    // 표현 문제: 유사도 계산 불필요 (뜻이 비슷한 표현들은 이미 동의어로 묶여 있음)
    // 정답의 명시된 동의어들만 오답에서 제외하고, 나머지는 그냥 풀에서 뽑아 채운다.
    var synSet = {};
    if(w.s) w.s.forEach(function(t){ synSet[String(t).toLowerCase().trim()]=1; });
    if(w.p) w.p.forEach(function(pr){ if(pr.s) pr.s.forEach(function(t){ synSet[String(t).toLowerCase().trim()]=1; }); });
    for(var i=0;i<cand.length&&d.length<4;i++){
      var c=cand[i];
      if(c.w===w.w||seen[c.m]) continue;
      if(synSet[String(c.w).toLowerCase().trim()]) continue;  // 정답의 동의어 → 제외
      seen[c.m]=1; d.push({m:c.m, w:c.w});
    }
  } else {
    // 단어 문제: 뜻이 겹치는 것(같은 뜻 계열)은 오답에서 제외 → '사실상 정답인데 오답' 방지
    // 정답과 뜻 토큰이 하나라도 겹치면 후보에서 뺀다 (conduct↔carry on 같은 오류 차단)
    for(var ii=0;ii<cand.length&&d.length<4;ii++){
      var cc=cand[ii];
      if(cc.w===w.w||seen[cc.m]) continue;
      if(shareMeaning(w.m, cc.m)) continue;        // 정답과 뜻 겹침 → 제외
      var dup=false;
      for(var j=0;j<d.length;j++){ if(shareMeaning(d[j].m, cc.m)){ dup=true; break; } }
      if(dup) continue;                            // 다른 오답과도 뜻 겹치면 제외
      seen[cc.m]=1; d.push({m:cc.m, w:cc.w});
    }
    // 2차: 그래도 4개 미만이면 정답과만 안 겹치면 허용 (오답끼리 겹침은 완화)
    for(var i2=0; i2<cand.length && d.length<4; i2++){
      var c2=cand[i2];
      if(c2.w===w.w||seen[c2.m]) continue;
      if(shareMeaning(w.m, c2.m)) continue;        // 정답과 겹치는 건 끝까지 금지
      seen[c2.m]=1; d.push({m:c2.m, w:c2.w});
    }
  }
  // 보기: {t:표시할 뜻, ok:정답 여부, srcw:그 뜻을 가진 단어/표현}
  var opts = shuf([{m:w.m, w:w.w, ok:true}].concat(d.map(function(x){return {m:x.m, w:x.w, ok:false};})))
    .map(function(o){ return {t:o.m, ok:o.ok, srcw:o.w}; });
  var ansIdx = opts.map(function(o){return o.ok;}).indexOf(true);
  return {w:w, opts:opts, ans:ansIdx, kind:'quiz', isPhrase:isPhrase};
}

function tagOf(w){
  return w.src==='Y' ? (w.vol+'권 '+w.day+'강') : ('MVP'+w.src.slice(-1));
}

function draw(){
  if(fin) return;
  var q=Q[qi];
  sel={};  // 이전 문제의 선택이 남지 않도록 초기화
  // next 버튼 상태 초기화
  var nx=$('next');
  if(nx){ nx.textContent='▶'; nx.classList.remove('fbtn'); }
  $('tag').textContent=tagOf(q.w)+' · #'+q.w.id;
  $('qw').innerHTML=esc(q.kind==='rev' ? q.prompt : q.w.w)+'<span id="qwmean"></span>';
  $('qw').classList.remove('hassim');
  var _ak=$('ask'); if(_ak) _ak.className='ask';
  if(MOPUP){
    var left=0; for(var _i=0;_i<ans.length;_i++) if(ans[_i]===null) left++;
    $('cnt').textContent='남은 '+left+'문제';
  } else {
    $('cnt').textContent=(qi+1)+' / '+Q.length;
  }
  $('fb').textContent='';
  $('info').classList.remove('on');
  $('info').innerHTML='';
  if($('qroot')){ $('qroot').style.display='none'; $('qroot').innerHTML=''; }
  if($('syninput')) $('syninput').value='';     // 새 문제에선 입력창 비우기
  $('prog').firstElementChild.style.width=(qi/Q.length*100)+'%';

  var box=$('ch'); box.innerHTML='';

  if(q.kind==='syn'){
    $('ask').textContent = (q.kind==='rev') ? '이 동의어의 원래 단어는? · 숫자키로 선택'
                                            : '동의어를 모두 고르세요 · 숫자키로 선택';
    q.opts.forEach(function(o,i){
      var b=document.createElement('button');
      b.className='c';
      b.innerHTML='<span class="onum">'+(i+1)+'</span><span class="otxt"></span>';
      b.querySelector('.otxt').textContent=o.t;
      b.onclick=(function(k){return function(){ toggle(k); };})(i);
      box.appendChild(b);
    });
    var sb=document.createElement('button');
    sb.id='sub'; sb.style.cssText='margin-top:6px;width:100%;padding:11px';
    sb.textContent='제출 (Enter)';
    sb.onclick=submitSyn;
    box.appendChild(sb);
  } else {
    $('ask').textContent = (q.isPhrase ? '이 표현의 뜻은?' : '이 단어의 뜻은?') + ' · 숫자키로 선택';
    q.opts.forEach(function(o,i){
      var b=document.createElement('button');
      b.className='c';
      b.innerHTML='<span class="onum">'+(i+1)+'</span><span class="otxt"></span>';
      b.querySelector('.otxt').textContent = (typeof o==='string') ? o : (o && o.t ? o.t : '');
      b.onclick=(function(k){return function(){ pick(k); };})(i);
      box.appendChild(b);
    });
  }

  score();
  if(ans[qi]!==null){ replay(); maybeShowFinishBtn(); }
  if(typeof applySynMode==='function') applySynMode();
}

function toggle(i){
  if(ans[qi]!==null) return;
  var q0=Q[qi];
  if(q0 && q0.kind==='rev'){          // 역방향은 하나만 고르는 방식
    sel={}; sel[i]=true;
    var bs0=$('ch').querySelectorAll('button.c');
    for(var z=0;z<bs0.length;z++) bs0[z].classList.toggle('sel', z===i);
    return;
  }
  var bs=$('ch').querySelectorAll('button.c');
  sel[i]=!sel[i];
  bs[i].classList.toggle('sel', !!sel[i]);
}

function submitSyn(){
  if(ans[qi]!==null) return;
  var q=Q[qi];
  var chosen=[];
  for(var k in sel) if(sel[k]) chosen.push(parseInt(k));
  if(!chosen.length){ $('fb').textContent='하나 이상 고르세요'; return; }

  var ok=true;
  q.opts.forEach(function(o,i){
    var picked=chosen.indexOf(i)>=0;
    if(o.ok!==picked) ok=false;
  });
  ans[qi]={sel:chosen, ok:ok};
  if(!ok){
    wrongs.push({w:q.w, mine:chosen.map(function(i){return q.opts[i].t;}).join(', '), kind:'syn'});
    bankAdd('syn', q.w);
    statsWrong(q.w, 'syn');
  } else {
    bankDel('syn', q.w);
    statsRight(q.w, 'syn');
  }
  bankSave();
  replay();
  score();
  maybeShowFinishBtn();
  sessionSave();
}

function pick(i){
  if(fin||ans[qi]!==null) return;
  var q=Q[qi];
  var ok=(i===q.ans);
  ans[qi]={sel:i, ok:ok};
  if(!ok){
    var mineT = (typeof q.opts[i]==='string') ? q.opts[i] : q.opts[i].t;
    wrongs.push({w:q.w, mine:mineT, kind:'quiz'});
    bankAdd('quiz', q.w);
    statsWrong(q.w, 'quiz');
  } else {
    bankDel('quiz', q.w);
    statsRight(q.w, 'quiz');
  }
  bankSave();
  replay();
  score();
  maybeShowFinishBtn();
  sessionSave();
}

// 모든 문제를 다 풀었으면 next 버튼을 '결과 보기'로 바꿔 노출
function maybeShowFinishBtn(){
  var allDone = ans.every(function(a){return a!==null;});
  var nx=$('next');
  if(allDone && nx){
    nx.textContent='결과 보기 🏁';
    nx.classList.add('fbtn');
  }
}

function replay(){
  // 정답이 공개되면 맨 위 단어 옆에 전체 뜻을 함께 표시
  (function(){
    var q0=Q[qi], el=$('qwmean');
    if(el && q0 && q0.w){
      el.textContent=' · '+q0.w.m;              // 단어 옆에 뜻
      var ak=$('ask'); if(ak) ak.textContent='';  // 안내 문구는 비움
      var sims0=similarOf(q0.w.w);
      if(sims0.length){ $('qw').classList.add('hassim'); }
      else { $('qw').classList.remove('hassim'); }
    }
  })();
  var q=Q[qi], a=ans[qi];
  var bs=$('ch').querySelectorAll('button.c');
  var sub=$('sub');
  if(sub) sub.style.display='none';

  for(var i=0;i<bs.length;i++){
    bs[i].disabled=false;                 // 어원 조회를 위해 클릭 가능 상태 유지
    bs[i].onclick=null;
    bs[i].classList.remove('sel');
    if(q.kind==='syn'){
      var picked=a.sel.indexOf(i)>=0;
      // 정답: 위에 '메인 단어의 어느 뜻' / 오답: 옆에 '그 단어의 뜻'
      var o=q.opts[i];
      if(o.ok && o.sense){
        bs[i].innerHTML='<em class="sns">'+esc(o.sense)+'</em>'+esc(o.t);
      } else if(!o.ok && o.def){
        bs[i].innerHTML=esc(o.t)+'<em class="od">'+esc(o.def)+'</em>';
      }
      if(q.opts[i].ok && picked) bs[i].classList.add('ok');
      else if(q.opts[i].ok && !picked) bs[i].classList.add('miss');
      else if(!q.opts[i].ok && picked) bs[i].classList.add('no');
      else bs[i].classList.add('dim');
      // 어원 조회용: 선지 단어를 기록하고, 어원 있으면 ⓔ 표시
      bs[i].setAttribute('data-qw', o.t);
      bs[i].classList.add('rootable');
      if(rootOfWord(o.t)){
        bs[i].classList.add('hasroot');
        if(bs[i].innerHTML.indexOf('rootdot')<0) bs[i].innerHTML += '<span class="rootdot">ⓔ</span>';
      }
      if(similarOf(o.t).length && bs[i].innerHTML.indexOf('simdot')<0){
        bs[i].innerHTML += '<span class="simdot">👀</span>';
      }
    } else {
      // 답 공개: 각 보기 뜻이 어느 단어/표현의 것인지 함께 보여 줌
      var o=q.opts[i];
      if(o && typeof o==='object' && o.srcw && !o.ok){
        bs[i].innerHTML=esc(o.t)+'<em class="od">'+esc(o.srcw)+'</em>';
      }
      if(i===q.ans) bs[i].classList.add('ok');
      else if(i===a.sel) bs[i].classList.add('no');
      else bs[i].classList.add('dim');
    }
  }
  $('fb').textContent = a.ok ? '✅ 정답!' : '❌ 오답';

  // 이번 선지에 나온 동의어를 기록해 두고, 해설에서 색으로 구분
  _shownSyn = null;
  if(q.kind==='syn'){
    _shownSyn = {};
    for(var si=0; si<q.opts.length; si++){
      _shownSyn[String(q.opts[si].t).toLowerCase().trim()]=1;
    }
  }
  var w=q.w, h='';
  h += (q.kind==='syn') ? renderPairs(w, null) : renderFlat(w);
  _shownSyn = null;

  if(w.r){
    h+='<div class="r" style="margin-top:7px">'+esc(w.r)+'</div>';
    var _rw=repWordsFor(w.r);
    if(_rw.length) h+=repToggleHTML(_rw);
  }
  h += relateHTML(w);
  // 표현(구문)이면 예문 자리 마련 → 비동기로 채움
  if(w.type==='phrase'){
    h+='<div class="ex" id="exBox">📝 예문 준비 중…</div>';
  }
  // 복습에 담기 버튼 (정답이어도 헷갈린 것 저장 가능)
  h+='<div style="margin-top:10px;text-align:center">'
    +'<button id="pinBtn" class="pinbtn"></button>'
    +'<button id="penBtn" class="penbtn"></button>'
    +'<button id="qmemo" class="memotog">📝 메모</button></div>'
    +'<div id="qmemobox"></div>';
  $('info').innerHTML=h;
  $('info').classList.add('on');
  $('prog').firstElementChild.style.width=((qi+1)/Q.length*100)+'%';
  if(w.type==='phrase') fillExample(w);
  pinBtnUI('pinBtn', w);
  penBtnUI('penBtn', w);
  var pin=$('pinBtn');
  if(pin) pin.onclick=function(){ pinAsk(w, 'pinBtn'); };
  var pen=$('penBtn');
  if(pen) pen.onclick=function(){ penToggle(w); penBtnUI('penBtn', w); };
  var qm=$('qmemo');
  if(qm){
    var mt2=memoGet(w.w);
    qm.classList.toggle('has', !!mt2);
    if(mt2) $('qmemobox').innerHTML='<div class="memoshow">📝 '+esc(mt2)+'</div>';
    qm.onclick=function(){
      var host=$('qmemobox');
      if(host.querySelector('.memowrap')){ host.innerHTML=''; qm.classList.remove('on'); }
      else { memoBox(w,'qmemobox'); qm.classList.add('on'); }
    };
  }
}

// 내가 직접 담아둔 단어인지 (틀려서 자동으로 들어간 것과 구분)
function isPinned(w){
  var r=STATS[w.w];
  return !!(r && r.pinned);
}
// 담기 / 빼기 토글
// nowToo: true면 이번 오답 풀기에도 바로 등장, false면 담아둔 목록에만
function pinForReview(w, nowToo){
  var k=w.w;
  if(!STATS[k]) STATS[k]={w:w.w, m:w.m, s:w.s, p:w.p, r:w.r, id:w.id, vol:w.vol, day:w.day, type:w.type, pp:w.pp, ug:w.ug, uf:w.uf, wrong:0, right:0};
  if(STATS[k].pinned){
    // 이미 담아둔 것 → 빼기 (오답 목록에서도 제거)
    STATS[k].pinned=0;
    STATS[k].pinNow=0;
    bankDel('syn', w); bankDel('quiz', w);
    bankSave();
  } else {
    STATS[k].pinned=1;
    STATS[k].pinNow = nowToo ? 1 : 0;
    if(STATS[k].wrong<1) STATS[k].wrong=1;
    STATS[k].due=Date.now();
    STATS[k].streak=0;
    if(nowToo){                      // 지금 오답 풀기에도 넣기
      bankAdd('syn', w); bankAdd('quiz', w);
      bankSave();
    }
  }
  statsSave();
  if(typeof bankUI==='function') bankUI();
  return !!STATS[k].pinned;
}
// 버튼 모양 갱신 (id를 넘겨받아 해당 화면 버튼만 건드림)
function pinBtnUI(id, w){
  var b=$(id); if(!b||!w) return;
  var on=isPinned(w);
  var now=!!(STATS[w.w] && STATS[w.w].pinNow);
  b.className='pinbtn'+(on?' pinned':'');
  b.textContent = on ? (now?'🔖 담김 · 오답에도 (누르면 빼기)':'🔖 담김 (누르면 빼기)') : '🔖 복습에 담기';
}
// 담기 선택 팝업 (지금 오답에도 / 나중에만)
function pinAsk(w, btnId){
  if(isPinned(w)){ pinForReview(w); pinBtnUI(btnId, w); return; }   // 이미 담긴 건 바로 빼기
  var host=$('pinAskBox');
  if(!host){
    host=document.createElement('div');
    host.id='pinAskBox';
    host.style.display='none';
    document.body.appendChild(host);
  }
  host.innerHTML='<div class="pkwrap"><div class="pkbox">'
    +'<div class="pkt">'+esc(w.w)+' 담기</div>'
    +'<button class="pkbtn now" data-pk="now">📌 지금 오답 풀기에도 넣기</button>'
    +'<button class="pkbtn later" data-pk="later">🔖 담아둔 목록에만</button>'
    +'<button class="pkbtn cancel" data-pk="cancel">취소</button>'
    +'</div></div>';
  host.style.display='';
  host.onclick=function(e){
    var t=e.target.closest('[data-pk]');
    if(!t){ if(e.target.classList.contains('pkwrap')){ host.style.display='none'; } return; }
    var v=t.getAttribute('data-pk');
    if(v!=='cancel'){ pinForReview(w, v==='now'); pinBtnUI(btnId, w); }
    host.style.display='none';
  };
}

// 표현 예문: 데이터의 ex 필드를 표시 (미리 만들어 데이터에 넣음)
function fillExample(w){

function score(){
  ['retry','wbtn'].forEach(function(id){ var b=$(id); if(b) b.style.display=''; });
  ['revGo','penGo2'].forEach(function(id){ var b=$(id); if(b) b.style.display='none'; });
  var d=0, o=0;
  ans.forEach(function(a){ if(a!==null){ d++; if(a.ok) o++; } });
  $('bar').textContent='점수 '+o+' / '+d+'   ·   '+(d?Math.round(o/d*100)+'%':'-');
}

function next(){
  if(fin) return;
  sel={};
  // 끝까지 한 번 돈 뒤에는, 안 푼 문제만 앞에서부터 차례로 (되돌아가지 않음)
  if(MOPUP){
    var nx=-1;
    for(var i=0;i<ans.length;i++){ if(ans[i]===null){ nx=i; break; } }
    if(nx===-1){ finish(); return; }
    qi=nx; draw(); sessionSave(); return;
  }
  if(qi<Q.length-1){ qi++; draw(); sessionSave(); }
  else{
    var u=ans.indexOf(null);
    if(u!==-1){
      MOPUP=true;              // 이제부터 미풀이 정리 모드
      qi=u; draw(); sessionSave();
    } else finish();
  }
}
function prev(){ if(!fin&&qi>0){ sel={}; qi--; draw(); sessionSave(); } }

function finish(){
  if(fin) return;
  fin=true;
  sessionClear();
  var o=0;
  ans.forEach(function(a){ if(a&&a.ok) o++; });
  var p=Math.round(o/Q.length*100);
  $('rs').textContent=o+' / '+Q.length;
  $('rp').textContent=p+'%';

  var m = st.mode;
  var left = (m==='card') ? 0 : bankList(m).length;
  var tail = (m!=='card') ? '  ·  누적 오답 ' + left + '개' : '';
  if(SRC==='rev'){
    $('rm').textContent = '🔄 역방향 확인 완료 — 이제 손으로 정리해볼까요?';
    var pb=$('penGo2'); if(pb) pb.style.display='';
  } else if(SRC==='bank'){
    $('rm').textContent = '누적 오답 풀기 완료' + tail;
  } else if(SRC==='retry'){
    $('rm').textContent = '오답 재시도 완료' + tail;
  } else {
    $('rm').textContent = (p>=90?'완벽해요 🎊' : p>=70?'거의 다 왔어요 💪' : '틀린 것부터 다시 보세요 📌') + tail;
  }

  $('retry').style.display = wrongs.length ? '' : 'none';
  $('wbtn').style.display = wrongs.length ? '' : 'none';
  $('wrong').style.display='none';

  // ── 이 강의 오답을 0개로 만들었으면 '손으로 쓸 단어'를 자동으로 ──
  var cleared = (m==='syn') && (bankListUnit('syn').length===0) && (SRC!=='card');
  if(cleared){
    var hadWrong=false;
    var mm=String(st.key||'').match(/^v(\d)d(\d+)$/);
    if(mm){
      var vv=parseInt(mm[1]), dd=parseInt(mm[2]);
      for(var kk in STATS){
        var rr=STATS[kk];
        if(rr.vol===vv && rr.day===dd && (rr.wrong||0)>0){ hadWrong=true; break; }
      }
    }
    if(hadWrong){
      dailyUnitDone(st.key);          // 오늘 완료한 강으로 기록
      $('rm').innerHTML='🎉 이 강 오답을 모두 해결했어요!';
      PEN_UNIT = st.key; PEN_RANDOM=false;
      // 마무리: 역방향 확인 → 손으로 쓸 단어
      var revBtn=$('revGo'), penBtn=$('penGo2');
      if(revBtn) revBtn.style.display='';
      if(penBtn) penBtn.style.display='';
      $('retry').style.display='none';
      $('wbtn').style.display='none';
      show('resscr');
      return;
    }
  }
  PEN_UNIT=null;
  show('resscr');
}

function showWrong(){
  var b=$('wi'); b.innerHTML='';
  if(!wrongs.length){ b.innerHTML='<div class="done">전부 맞혔어요 🎉</div>'; }
  wrongs.forEach(function(x){
    var w=x.w, d=document.createElement('div');
    d.className='wi';
    var h='<div class="n">'+tagOf(w)+' · #'+w.id+'</div>'+
          '<div class="w">'+esc(w.w)+'</div>'+
          '<div class="x">내 답: '+esc(x.mine)+'</div>'+

      var _rw3=repWordsFor(w.r);

    }
    d.innerHTML=h; b.appendChild(d);
  });
  $('wrong').style.display='block';
  $('wrong').scrollIntoView({behavior:'smooth'});
}

function applySynMode(){
  var q=Q[qi];
  if(q && q.kind==='rev'){
    $('ask').textContent='이 동의어의 원래 단어는? · 숫자키로 선택';

  if(SYN_TYPING && q && q.kind==='syn' && !fin && ans[qi]===null){

  }
  var isSyn = q && q.kind==='syn' && !fin && ans[qi]===null;
  $('synmodetog').textContent = SYN_TYPING ? '👆 눌러서 풀기' : '⌨️ 입력으로 풀기';
  $('synmodetog').className = 'modetog'+(SYN_TYPING?' on':'');
  $('synmodebar').style.display = (q && q.kind==='syn') ? '' : 'none';
  $('synwrap').style.display = (SYN_TYPING && isSyn) ? '' : 'none';
  $('ch').className = 'ch'+(SYN_TYPING?' typing':'');
  if(q && q.kind==='syn' && ans[qi]===null){
    $('ask').textContent = SYN_TYPING
      ? '보기를 보고 동의어를 입력하세요'
      : '동의어를 모두 고르세요 · 숫자키로 선택';
  }
}
function synTypeSubmit(){
  var q=Q[qi];
  if(!q || q.kind!=='syn' || fin || ans[qi]!==null) return;
  var v=$('syninput').value.trim();
  if(!v) return;
  var nv=normSyn(v);
  var hit=-1;
  for(var i=0;i<q.opts.length;i++){
    if(normSyn(q.opts[i].t)===nv){ hit=i; break; }
  }
  $('syninput').value='';
  if(hit<0){
    $('fb').textContent='보기에 없는 단어예요';
    $('fb').style.color='#f0a500';
    return;
  }
  if(!sel[hit]) toggle(hit);   // 보기 선택 (클릭과 동일 처리)
  $('fb').textContent='';
  // 고른 개수 세기
  var n=0; for(var k in sel) if(sel[k]) n++;
  if(n>=q.need) submitSyn();   // 정답 개수만큼 골랐으면 자동 제출
  else $('syninput').focus();
}

  if(e.key>='1' && e.key<='9' && !this.value){
    var q0=Q[qi];
    if(q0 && q0.kind==='syn' && ans[qi]===null){
      e.preventDefault(); e.stopPropagation();
      var idx=parseInt(e.key)-1;
      if(idx<q0.opts.length) toggle(idx);
      return;
    }
  }
  if(e.key==='Enter'){
    e.preventDefault(); e.stopPropagation();
    if(ans[qi]!==null){ next(); }        // 이미 채점됨 → 다음 문제
    else synTypeSubmit();                 // 아직이면 제출
  }
  else if(e.key==='ArrowRight' && !this.value){ e.preventDefault(); e.stopPropagation(); next(); }
  else if(e.key==='ArrowLeft' && !this.value){ e.preventDefault(); e.stopPropagation(); prev(); }
});

function dayOpen(k){
  DAY_KEY=k;
  var d=DAILY[k]||{syn:0, copy:0, units:[]};
  var dv=diaryGet(k);
  var t=k.split('-');
  $('dayTitle').textContent=t[1]+'월 '+t[2]+'일';

  // ── 달성률 ──
  var syn=d.syn||0, pct=Math.min(100, Math.round(syn/DAILY_GOAL*100));
  var done=syn>=DAILY_GOAL;
  var h='<div class="dgoal'+(done?' ok':'')+'">'
    +'<div class="dgtop"><span class="dgnum">'+syn+' <span class="dgof">/ '+DAILY_GOAL+'</span></span>'
    +'<span class="dgpct">'+(done?'🎉 달성':pct+'%')+'</span></div>'
    +'<div class="dgbar"><div class="dgfill'+(done?' ok':'')+'" style="width:'+pct+'%"></div></div>';
  if(!done && syn>0) h+='<div class="dgleft">'+(DAILY_GOAL-syn)+'개 남음</div>';
  h+='</div>';

  // ── 완료한 강 ──
  var us=d.units||[];
  if(us.length){
    h+='<div class="dunits"><span class="dulab">✅ 완료한 강</span>';
    for(var i=0;i<us.length;i++) h+='<span class="duchip">'+esc(unitLabelOf(us[i]))+'</span>';
    h+='</div>';
  }
  if(d.copy) h+='<div class="dcopy">✏️ 따라쓰기 '+d.copy+'개</div>';
  $('dayAuto').innerHTML=h;

  // ── 계획 체크리스트 ──
  var lines=diaryLines(k);
  var cl=$('dayCheck');
  if(lines.length){
    var doneN=0;
    var ch='';
    for(var j=0;j<lines.length;j++){
      if(lines[j].on) doneN++;
      ch+='<div class="ckrow'+(lines[j].on?' on':'')+'" data-i="'+lines[j].i+'">'
        +'<span class="ckbox">'+(lines[j].on?'✓':'')+'</span>'
        +'<span class="cktxt">'+esc(lines[j].t)+'</span></div>';
    }
    cl.innerHTML='<div class="cktop">📌 계획 '+doneN+'/'+lines.length+' 완료</div>'+ch;
    cl.style.display='';
  } else { cl.innerHTML=''; cl.style.display='none'; }

  $('dayTodo').value=dv.todo;
  $('dayDone').value=dv.done;
  $('dayMsg').textContent='';
  $('dayPanel').style.display='';
}

      ROOT_OPEN=true;   // 동의어 어원을 눌렀으면 펼쳐서 보여줌
      if(rr){
        box.innerHTML=rootBody(nm+' 어원', rr, repWordsFor(rr), true);
      } else {
        var on=!!ROOTREQ[String(nm).toLowerCase().trim()];
        box.innerHTML=rootBody(nm, '어원 정보가 없습니다', null, true)
          +'<div class="reqrow"><button class="reqbtn'+(on?' on':'')+'" data-req="'+esc(nm)+'">'
          +(on?'✓ 어원 요청 목록에 있음 (누르면 취소)':'➕ 어원 요청 목록에 담기')+'</button></div>';
      }
      box.style.display='';
    }
    setTimeout(function(){ var i=$('cinput'); if(i) i.focus(); },0);
    return;
  }
  // 어원 요청 담기/취소
  var rq=e.target.closest && e.target.closest('.reqbtn');
  if(rq){
    var nm2=rq.getAttribute('data-req');
    var added=rootReqAdd(nm2, CQ[cqi]?CQ[cqi].w:'');
    rq.className='reqbtn'+(added?' on':'');
    rq.textContent = added ? '✓ 어원 요청 목록에 있음 (누르면 취소)' : '➕ 어원 요청 목록에 담기';
    if(typeof reqUI==='function') reqUI();
    setTimeout(function(){ var i=$('cinput'); if(i) i.focus(); },0);
    return;
  }
  // 어원 헤더 클릭 → 접기/펼치기
  var rh=e.target.closest && e.target.closest('#crooth');
  if(rh){
    toggleRoot();
    setTimeout(function(){ var i=$('cinput'); if(i) i.focus(); },0);
    return;
  }
  // '메인 어원 보기'로 되돌리기
  if(e.target.classList && e.target.classList.contains('crootback')){
    drawCopyRoot(CQ[cqi]);
    setTimeout(function(){ var i=$('cinput'); if(i) i.focus(); },0);
    return;
  }
  if(e.target.closest('button') || e.target.id==='cinput') return;
  setTimeout(function(){ var i=$('cinput'); if(i) i.focus(); },0);
});
$('cprevb').addEventListener('click',copyPrev);
$('cnextb').addEventListener('click',function(){ copyNext(); });
$('cpin').addEventListener('click',function(){
  var w=CQ[cqi]; if(!w) return;
  pinAsk(w, 'cpin');
});
$('cpen').addEventListener('click',function(){
  var w=CQ[cqi]; if(!w) return;
  penToggle(w);
  penBtnUI('cpen', w);
  setTimeout(scrollCurChip, 30);
  var mb=$('cmemobox'), mtog=$('cmemo');
  if(mb){
    var mt=memoGet(w.w);
    if(mt){ mb.innerHTML='<div class="memoshow">📝 '+esc(mt)+'</div>'; }
    else mb.innerHTML='';
    if(mtog) mtog.classList.toggle('has', !!mt);
  }
});
$('cmemo').addEventListener('click',function(){
  var w=CQ[cqi]; if(!w) return;
  var host=$('cmemobox');
  if(host.innerHTML){ host.innerHTML=''; this.classList.remove('on'); }
  else { memoBox(w,'cmemobox'); this.classList.add('on'); }
});
$('cinput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); copySubmit(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); e.stopPropagation(); toggleRoot(); }
  else if(e.key==='ArrowRight' && !this.value){ e.preventDefault(); e.stopPropagation(); cWaiting=false; copyNext(); }
  else if(e.key==='ArrowLeft' && !this.value){ e.preventDefault(); e.stopPropagation(); cWaiting=false; copyPrev(); }
});
$('cohome').addEventListener('click',function(){ bankUI(); statsUI(); resumeUI(); srsUI(); reqUI(); todayUI(); syncUI(); refreshUnitLabels(); show('setup'); });
$('winput').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); writeSubmit(); } });
$('wskip').addEventListener('click',function(){ writeReveal(false); });
$('wnext').addEventListener('click',writeNext);
$('whome').addEventListener('click',function(){ bankUI(); statsUI(); resumeUI(); show('setup'); });

$('bankGo').addEventListener('click',function(){ startBank(false); });
$('bankGoUnit').addEventListener('click',function(){ startBank(true); });
$('bankClr').addEventListener('click',function(){
  var m=st.mode;
  if(m==='card') return;
  var n=bankList(m).length;
  if(!n) return;
  if(!confirm('누적 오답 '+n+'개를 모두 지울까요?')) return;
  BANK[m]={};
  bankSave();
  bankUI();
});

document.addEventListener('keydown',function(e){
  if($('cardscr').classList.contains('on')){
    if(e.key===' '){ e.preventDefault(); $('cinner').classList.toggle('flip'); }
    else if(e.key==='ArrowRight'&&CI<SET.length-1){ CI++; drawCard(); }
    else if(e.key==='ArrowLeft'&&CI>0){ CI--; drawCard(); }
    return;
  }
  // 따라쓰기: 화살표 이동 + ↓ 어원 토글 + Enter(입력창 밖에서도 동작)
  if($('copyscr').classList.contains('on')){
    if(e.key==='ArrowDown'){ e.preventDefault(); toggleRoot(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); cWaiting=false; copyNext(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); cWaiting=false; copyPrev(); }
    else if(e.key==='Enter'){
      // 입력창에 포커스가 없어도 Enter로 진행되게 (포커스 잃었을 때 멈추는 문제 방지)
      if(document.activeElement!==$('cinput')){
        e.preventDefault();
        copySubmit();
        $('cinput').focus();
      }
    }
    return;
  }
  if(!$('qscr').classList.contains('on')||fin) return;
  var q=Q[qi];
  // 입력 모드에서 입력창에 포커스가 있으면 전역 단축키가 가로채지 않게
  if(SYN_TYPING && document.activeElement===$('syninput')) return;
  if(e.key>='1'&&e.key<='9'){
    e.preventDefault();          // 숫자가 입력창으로 새어드는 것 방지
    var i=parseInt(e.key)-1;
    if(q.kind==='syn'){ if(i<q.opts.length) toggle(i); }
    else if(i<q.opts.length) pick(i);
  }
  else if(e.key==='Enter'){
    e.preventDefault();
    if(q.kind==='syn'&&ans[qi]===null) submitSyn();
    else next();
  }
  else if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
});

boot();
